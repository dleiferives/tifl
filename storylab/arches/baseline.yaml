id: baseline
description: >
  The current pipeline as a linear DAG: plan, then outline, then write with a
  coverage retry, then a 3-pass alternating-lens refine.
result: refine
result_extract: null

nodes:
  - id: plan
    prompt: planner
    merge: [new_chunks, target_constructions]   # promote to shared context

  - id: outline
    prompt: outline
    needs: [plan]
    optional: true        # non-fatal, like the backend

  - id: draft
    prompt: writer
    needs: [outline]
    extract: text
    loop: { until: "coverage(draft) >= target", max: 3 }   # coverage retry

  - id: refine
    prompt: reviser
    needs: [draft]
    extract: text
    loop: { cycle: [narrative, language, naturalness], passes: 3, input: draft }
