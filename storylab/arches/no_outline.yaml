id: no_outline
description: Plan + writer with coverage retry. No separate plot outline stage.
result: draft
result_extract: null

nodes:
  - id: plan
    prompt: planner
    merge: [new_chunks, target_constructions]

  - id: draft
    prompt: writer
    needs: [plan]
    extract: text
    loop: { until: "coverage(draft) >= target", max: 3 }
