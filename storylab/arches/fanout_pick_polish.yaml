id: fanout_pick_polish
description: >
  Fan-out: write 3 independent drafts in parallel from one outline. Fan-in:
  the judge picks the best of the 3. Then polish it with a 2-pass refine.
  Demonstrates foreach + select(by judge) + loop in one DAG.
result: polish
result_extract: null

nodes:
  - id: outline
    prompt: outline

  - id: drafts
    prompt: writer
    needs: [outline]
    foreach: "range(3)"      # 3 parallel candidate stories
    extract: text

  - id: best
    type: select
    from: drafts
    by: judge                # LLM picks the strongest of the 3

  - id: polish
    prompt: reviser
    needs: [best]
    extract: text
    loop: { cycle: [narrative, naturalness], passes: 2, input: best }
