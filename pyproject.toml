[project]
name = "story-llm"
version = "0.1.0"
description = "Greek L2 acquisition system — input-output cycle with implicit grammar acquisition"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# storylab — the ablation harness. Not needed to run the backend app.
# The spaCy Greek MODEL and the frequency list are not pip deps; install them
# with `just setup` in storylab/ (see storylab/justfile).
lab = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "spacy>=3.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "spacy>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "real_llm: hits the real `opencode` CLI. Set LEARN_GREEK_REAL_LLM=1 to enable.",
]

[tool.setuptools.packages.find]
include = ["backend*"]
