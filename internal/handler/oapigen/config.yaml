# oapi-codegen configuration (#213): types-only generation. The handlers, mux
# registration, and middleware stay hand-written; only the wire types come
# from the spec, so spec -> Go -> TS is one `make generate-api`.
package: oapigen
output: types.gen.go
generate:
  models: true
output-options:
  skip-prune: true
  # Optional fields as values with omitempty (not pointers) — matches the
  # hand-written DTO convention, so migrated families are pure type aliases.
  prefer-skip-optional-pointer: true
