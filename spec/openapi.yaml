          type: integer
          format: int64
          description: Unix seconds when the client should refresh the URL.
        content_type: { type: string }
        size:
          type: integer
          format: int64
          minimum: 0
      required: [url, expires_at, content_type, size]
    TaskReportReason:
      type: string
      enum: [malformed, wrong_answer_key, nonsensical, too_hard]
    TaskReportStatus:
      type: string
      enum: [none, queued, regenerating, regenerated, failed, answered, cap_reached, unavailable]
    TaskReportState:
      type: object
      description: Latest report/regeneration state for this task, if any.
      properties:
        report_id: { type: string }
        status:
          $ref: "#/components/schemas/TaskReportStatus"
        reason:
          $ref: "#/components/schemas/TaskReportReason"
        message: { type: string }
        replacement_task_id:
          type: string
          description: Task id containing the regenerated content; same as task_id when replacement is in place.
        reported_at: { type: number, format: double }
        updated_at: { type: number, format: double }
        regeneration_cap:
          type: integer
          minimum: 0
        regenerations_used:
          type: integer
          minimum: 0
      required: [report_id, status, reason, message, reported_at, regeneration_cap, regenerations_used]
    SessionTasks:
      type: object
      properties:
        session_id: { type: string }
        total: { type: integer }
        completed: { type: integer, description: number of tasks already graded }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
      required: [session_id, total, completed, tasks]
    SubmitTaskRequest:
      type: object
      properties:
        response:
          type: object
          additionalProperties: true
          description: type-specific response JSON (e.g. {selected_index}, {answer}, {text})
        input_method:
          type: string
          description: 'property of the response; only "typed" supported today'
          enum: [typed]
        reference_assisted:
          type: boolean
          description: True when the answer followed an explicit story/reference peek.
      required: [response]
    TaskReportRequest:
      type: object
      properties:
        reason:
          $ref: "#/components/schemas/TaskReportReason"
        note:
          type: string
          maxLength: 1000
          description: Optional learner note explaining the defect.
      required: [reason]
    TaskReportResponse:
      type: object
      properties:
        report_id: { type: string }
        task_id: { type: string }
        status:
          $ref: "#/components/schemas/TaskReportStatus"
        message: { type: string }
        replacement_task_id:
          type: string
          description: Present when regeneration has already produced or will update a task id.
        regeneration_cap:
          type: integer
          minimum: 0
        regenerations_used:
          type: integer
          minimum: 0
      required: [report_id, task_id, status, message, regeneration_cap, regenerations_used]
    SubmitTaskResponse:
      type: object
      properties:
        task_id: { type: string }
        grade: { $ref: "#/components/schemas/Grade" }
        skill_xp:
          type: array
          description: Skill XP deltas persisted for this accepted grade.
          items:
            $ref: "#/components/schemas/SkillXPDelta"
        reference_assisted:
          type: boolean
          description: Persisted retrieval-integrity flag for this submission.
        attempt_count:
          type: integer
          minimum: 1
          description: How many times this task has been submitted (1 = first submission).
      required: [task_id, grade, skill_xp, reference_assisted, attempt_count]
    SkillXPDelta:
      type: object
      properties:
        skill_id: { type: string }
        xp_delta: { type: integer }
        xp_before: { type: integer, minimum: 0 }
        xp_after: { type: integer, minimum: 0 }
        tier_before: { type: integer, minimum: 0 }
        tier_after: { type: integer, minimum: 0 }
        pending_verify:
          type: boolean
          description: True when the skill crossed a tier threshold and awaits verification.
      required:
        - skill_id
        - xp_delta
        - xp_before
        - xp_after
        - tier_before
        - tier_after
        - pending_verify
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
