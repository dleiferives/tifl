          type: string
          description: Raw gateway error response body when available.
        called_at: { type: number, format: double }
        cost_usd:
          type: number
          format: double
          description: >
            Derived USD cost (input+output tokens × configured model pricing).
            Present only when cost_known is true.
        cost_known:
          type: boolean
          description: >
            Whether this call's model has configured pricing. When false the
            cost is unknown (not zero) and clients render it as such (#24).
      required:
        - call_id
        - kind
        - prompt_version
        - model
        - status
        - called_at
        - cost_known
    LLMCallLogRow:
      type: object
