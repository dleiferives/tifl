openapi: 3.1.0
info:
  title: tifl API
  version: 0.0.1
  description: >
    Canonical contract for the tifl API server. The OpenAPI spec is the only
    contract between clients (browser / Tauri / Capacitor) and the server; every
    client is generated or hand-written against it and reaches no server
    internals. Endpoints are added here as their handlers land.
    See context/backend-server.md and context/architecture-overview.md.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /ping:
    get:
      summary: Liveness ping
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
        "401":
          $ref: "#/components/responses/Unauthorized"
  /languages:
    get:
      summary: List enabled language plugins
      operationId: listLanguages
      responses:
        "200":
          description: Registered languages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/register:
    post:
      security: []
      summary: Register and immediately authenticate a user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Account created; rotated refresh credential set as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/login:
    post:
      security: []
      summary: Authenticate with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Authenticated; refresh credential set as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/refresh:
    post:
      security: []
      summary: Rotate the refresh cookie and issue a new access token
      operationId: refresh
      responses:
        "200":
          description: Refreshed
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      security: []
      summary: Revoke the current refresh cookie
      operationId: logout
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              schema: { type: string }
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/logout-all:
    post:
      summary: Revoke every refresh session for the current user
      operationId: logoutAll
      responses:
        "204":
          description: All refresh sessions revoked
          headers:
            Set-Cookie:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me:
    get:
      summary: Return the authenticated user
      operationId: me
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /profile:
    get:
      summary: Return the current user's profile and client preferences
      description: >
        Returns the typed product profile used for default session generation
        and UI bootstrapping. In local/no-auth mode this is the synthetic
        `local` user's profile. Missing fields are defaulted server-side.
      operationId: getProfile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      summary: Partially update the current user's profile
      description: >
        Updates typed profile fields and shallow-merges the `preferences` object
        into the existing arbitrary client-preferences map. A preference value of
        `null` deletes that key. Unknown top-level fields are rejected so product
        state stays explicit; client-owned arbitrary values belong under
        `preferences`.
      operationId: patchProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions:
    get:
      summary: List sessions for the current user
      description: >
        Newest-first session overview page for home/resume screens. Includes
        generation status, story_id when available, selected target/new counts,
        and compact task progress counts without opening the SSE stream or
        fetching task bodies.
      operationId: listSessions
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Session overview page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/generate:
    post:
      summary: Start generating a session (story + tasks)
      description: >
        Creates a session and kicks off the staged generation pipeline
        asynchronously, returning immediately. If language or level is omitted,
        the current profile's active_language or level is used. Poll progress via
        /sessions/{id}/events. Returns 503 if no LLM gateway is configured.
      operationId: generateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "202":
          description: Generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}:
    get:
      summary: Get session detail and persisted generation progress
      description: >
        Returns one tenant-scoped session with the metadata needed to navigate to
        reader/tasks, retry failed generation, or render a progress screen without
        subscribing to SSE. Another user's session returns 404.
      operationId: getSessionDetail
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/events:
    get:
      summary: Stream generation progress (SSE)
      description: >
        Server-Sent Events stream of stage transitions. On connect the current
        persisted stage state is replayed, then live events follow until a
        terminal `{"stage":"done"}` event. The terminal event is enriched from
        persisted session detail so late subscribers receive the same navigation
        fields as live subscribers: final status, session_id, story_id when
        ready, compact task progress, stage summary, and failed stage/error code
        when generation failed. token_rate is an approximate upstream
        tokens/second during story generation (a ticker animation); story text
        is never streamed.
      operationId: sessionEvents
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/GenerationEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/retry:
    post:
      summary: Retry a failed generation from its failed stage
      description: >
        Resumes generation using session_generation_stages: a full re-run if the
        story never completed, or only the failed task-type stages otherwise.
      operationId: retrySession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "202":
          description: Retry started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /stories/{id}:
    get:
      summary: Load a story for the reader (tokens + knowledge in one call)
      description: >
        Returns the server-tokenized story plus the caller's per-item knowledge
        map (canonical key → level + lookup_count) for the story's language, in a
        single response — everything the reader needs at load time. Words the user
        has never interacted with are absent from the map and treated as unseen.
        Stories are user-scoped; another user's story returns 404.
      operationId: getStory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Story tokens + knowledge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryLoad"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/{id}/definition:
    get:
      summary: Resolve a word definition for the reader popup
      description: >
        Walks the resolution chain for one word key: per-story glossary →
        knowledge_items.metadata → global shared cache → live (Wiktionary, then
        LLM). A live result is written to the shared cache so the next learner
        gets it free. Returns 503 if a live LLM lookup is needed but no gateway is
        configured.
      operationId: getDefinition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: key
          in: query
          required: true
          description: canonical knowledge key to define
          schema: { type: string }
      responses:
        "200":
          description: Definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Definition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/{id}/sentence:
    post:
      summary: Sentence breakdown for the sentence containing a position
      description: >
        Returns the LLM-backed breakdown of the sentence containing the given
        token position, served from a global cache keyed by the hash of the
        normalized sentence (so the same sentence in any story reuses it). The
        response body is the breakdown JSON (shape owned by the prompt builder).
      operationId: postSentenceBreakdown
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position: { type: integer }
              required: [position]
      responses:
        "200":
          description: Sentence breakdown JSON
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/{id}/word:
    post:
      summary: Deep morphological/etymological breakdown of a word
      description: >
        Returns the LLM-backed deep breakdown of a word, served from a global
        cache keyed by the canonical word key. The response body is the breakdown
        JSON (shape owned by the prompt builder).
      operationId: postWordBreakdown
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string }
              required: [key]
      responses:
        "200":
          description: Word breakdown JSON
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /reader/events:
    post:
      summary: Ingest a flushed batch of reader events
      description: >
        Appends a batch of behavioural events to the durable log (idempotent on
        event_id) and derives knowledge signals from the newly-stored ones —
        lookup_count, the per-item level (from rate events), and story exposure /
        context variety (counted once per first read). The caller's identity is
        authoritative; the payload carries no user_id.
      operationId: postReaderEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderEventsRequest"
      responses:
        "202":
          description: Accepted; reports how many events were newly stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingested: { type: integer }
                required: [ingested]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /word_knowledge/{token}:
    put:
      summary: Optimistic knowledge-rating write for one word key
      description: >
        Sets the learner's level for the word whose canonical key is {token}.
        Fire-and-forget from the client (the reader updates local state instantly);
        the response is a bare 204. Idempotent — safe to race a later rate event in
        a flushed batch.
      operationId: putWordKnowledge
      parameters:
        - name: token
          in: path
          required: true
          description: canonical knowledge key (lemma/root/stem per language)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordKnowledgeRequest"
      responses:
        "204": { description: Applied }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/tasks:
    get:
      summary: List a session's tasks to present (answer-free)
      description: >
        Returns every task for the session in presentation form — content runs
        through the task type's Present view, so answer keys (correct_index,
        acceptable_forms) and internal item ids never reach the client — plus a
        completed/total progress count. The session is tenant-scoped; another
        user's session is a 404. A task already submitted carries its grade.
      operationId: getSessionTasks
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Session tasks + progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTasks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}:
    get:
      summary: Fetch one task to present (answer-free)
      description: >
        Returns one task in presentation form (Present-filtered content plus the
        grade once submitted), scoped to the owning user. Another user's task is a
        404.
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Presented task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}/submit:
    post:
      summary: Submit a response, grade it, update the learning signal
      description: >
        Grades the submitted response, persists it, and folds the outcome into
        user_knowledge (task_total for every targeted item, task_correct for the
        demonstrated ones). Rule-graded types (comprehension_mc, fill_blank) grade
        in-process with no model call; LLM-graded types (production) route through
        the gateway and return 503 when no gateway is configured. input_method is
        a property of the response — only "typed" is supported today (scan/audio
        later). A task that already carries a grade is rejected with 409;
        re-submission to improve a grade is future work.
      operationId: submitTask
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTaskRequest"
      responses:
        "200":
          description: The grade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitTaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
# Planned surfaces (see context/): /skills.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionID:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    Language:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        key_strategy:
          type: string
          enum: [surface, lemma, root, stem]
        enabled: { type: boolean }
      required: [code, name, key_strategy, enabled]
    Credentials:
      type: object
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 15
          maxLength: 128
      required: [email, password]
    User:
      type: object
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        created_at: { type: number }
        last_login: { type: number }
      required: [user_id, email, created_at]
    AuthResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 900 }
        user:
          $ref: "#/components/schemas/User"
      required: [access_token, token_type, expires_in, user]
    GenerateRequest:
      type: object
      properties:
        language:
          type: string
          description: "registered enabled language code, e.g. 'el'; defaults to profile.active_language"
        level:
          type: string
          description: "beginner|elementary|intermediate|upper-intermediate|advanced; defaults to profile.level"
        session_type:
          type: string
          enum: [system, topic_guided, expression_guided]
        topic: { type: string, description: "topic_guided only" }
        user_expressions:
          type: array
          items: { type: string }
          description: "expression_guided only"
        expression_output:
          type: string
          enum: [phrases, story]
          description: "expression_guided only"
    Profile:
      type: object
      properties:
        user_id: { type: string }
        active_language:
          type: string
          description: "enabled language code used when generation omits language"
        level:
          type: string
          enum: [beginner, elementary, intermediate, upper-intermediate, advanced]
          description: "current generation default; product state that level-derivation can update"
        ui_language:
          type: string
          description: "BCP-47 style UI/gloss language tag, e.g. 'en'"
        theme:
          type: string
          description: "theme id, e.g. 'default' or 'high-contrast'"
        preferences:
          type: object
          additionalProperties: true
          description: "arbitrary client-owned preferences; product-critical fields remain top-level"
      required: [user_id, active_language, level, ui_language, theme, preferences]
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        active_language:
          type: string
          description: "must name an enabled language"
        level:
          type: string
          enum: [beginner, elementary, intermediate, upper-intermediate, advanced]
          description: "current generation default; clients should not treat this as arbitrary preference state"
        ui_language:
          type: string
          description: "BCP-47 style UI/gloss language tag"
        theme:
          type: string
          description: "letters, numbers, '_' and '-' only"
        preferences:
          type: object
          additionalProperties: true
          description: "shallow-merged; null values delete keys"
    SessionRef:
      type: object
      properties:
        session_id: { type: string }
        status: { type: string }
      required: [session_id, status]
    SelectedItemCounts:
      type: object
      description: Persisted SelectedItems counts; background items are not currently stored.
      properties:
        targets: { type: integer }
        new: { type: integer }
      required: [targets, new]
    TaskProgress:
      type: object
      properties:
        total: { type: integer }
        completed: { type: integer, description: number of tasks already graded }
        pending: { type: integer }
      required: [total, completed, pending]
    SessionOverview:
      type: object
      description: One home/resume row for the current user.
      properties:
        session_id: { type: string }
        story_id: { type: string, description: "present once story generation has persisted a story" }
        language: { type: string }
        level: { type: string }
        session_type:
          type: string
          enum: [system, topic_guided, expression_guided]
        topic: { type: string }
        user_expressions:
          type: array
          items: { type: string }
        expression_output:
          type: string
          enum: [phrases, story]
        status:
          type: string
          enum: [pending, generating, ready, reading, complete, failed]
        created_at: { type: number }
        reading_started_at: { type: number }
        completed_at: { type: number }
        selected_counts:
          $ref: "#/components/schemas/SelectedItemCounts"
        tasks:
          $ref: "#/components/schemas/TaskProgress"
      required:
        - session_id
        - language
        - level
        - session_type
        - status
        - created_at
        - selected_counts
        - tasks
    SessionList:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionOverview"
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
      required: [sessions, limit, offset, has_more]
    StageSummary:
      type: object
      properties:
        total: { type: integer }
        pending: { type: integer }
        in_progress: { type: integer }
        complete: { type: integer }
        failed: { type: integer }
        active_stage: { type: string }
        failed_stage: { type: string }
      required: [total, pending, in_progress, complete, failed]
    GenerationStageRecord:
      type: object
      properties:
        stage: { type: string }
        status:
          type: string
          enum: [pending, in_progress, complete, failed]
        started_at: { type: number }
        completed_at: { type: number }
        error_code: { type: string }
        error_detail: { type: string }
        retry_count: { type: integer }
      required: [stage, status, retry_count]
    SessionDetail:
      allOf:
        - $ref: "#/components/schemas/SessionOverview"
        - type: object
          properties:
            stage_summary:
              $ref: "#/components/schemas/StageSummary"
            stages:
              type: array
              items:
                $ref: "#/components/schemas/GenerationStageRecord"
          required: [stage_summary, stages]
    GenerationEvent:
      type: object
      description: >
        One SSE progress message (the JSON in each data line). Non-terminal
        events report a pipeline stage status. The terminal `stage: done` event
        reports the final session status plus enough persisted state for the
        client to navigate to reader/tasks or show retry/error UI without
        guessing.
      properties:
        stage:
          type: string
          description: "selection|story_generation|tokenization|task_<type>|done"
        status:
          type: string
          description: "stage status for progress events; final session status for stage=done"
          enum: [pending, in_progress, complete, failed, generating, ready, reading]
        session_id:
          type: string
          description: "present on stage=done"
        story_id:
          type: string
          description: "present on stage=done once a story has been persisted"
        token_rate: { type: integer, description: "approx upstream tokens/sec" }
        error_code:
          type: string
          description: "stable code on failed progress events and failed terminal events"
        failed_stage:
          type: string
          description: "first failed stage, present on failed terminal events"
        tasks:
          $ref: "#/components/schemas/TaskProgress"
        stage_summary:
          $ref: "#/components/schemas/StageSummary"
      required: [stage]
    StoryToken:
      type: object
      description: One token of the server-tokenized story; non-word tokens carry no key.
      properties:
        position: { type: integer, description: "0-indexed, stable identifier" }
        surface: { type: string, description: "display form incl. punctuation" }
        key: { type: string, description: "canonical knowledge key; omitted for non-word tokens" }
        is_word: { type: boolean }
      required: [position, surface, is_word]
    ReaderKnowledge:
      type: object
      description: The reader's per-item view, keyed by canonical key.
      properties:
        level:
          type: string
          description: "learner self-rating; '' (omitted)=unseen"
          enum: ["", "1", "2", "3", "4", "5", well_known, ignored]
        lookup_count: { type: integer }
      required: [level, lookup_count]
    StoryLoad:
      type: object
      description: Everything the reader needs at load time, in one response.
      properties:
        story_id: { type: string }
        language: { type: string }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/StoryToken" }
        knowledge:
          type: object
          description: "canonical key → knowledge state; unseen items are absent"
          additionalProperties: { $ref: "#/components/schemas/ReaderKnowledge" }
      required: [story_id, language, tokens, knowledge]
    ReaderEvent:
      type: object
      description: One logged reader interaction.
      properties:
        event_id: { type: string, description: "client idempotency key; generated if omitted" }
        story_id: { type: string }
        session_id: { type: string }
        event_type:
          type: string
          enum: [lookup, rate, navigate, sentence_break]
        position: { type: integer, description: "story token position the event is about" }
        value: { type: string, description: 'rate only: "1".."5" | "w" | "i"' }
        occurred_at: { type: number, description: "Unix seconds (client clock)" }
      required: [story_id, event_type]
    ReaderEventsRequest:
      type: object
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/ReaderEvent" }
      required: [events]
    WordKnowledgeRequest:
      type: object
      properties:
        language: { type: string }
        level:
          type: string
          description: "'' clears to unseen"
          enum: ["", "1", "2", "3", "4", "5", well_known, ignored]
      required: [language, level]
    Definition:
      type: object
      description: A resolved word definition for the reader popup.
      properties:
        key: { type: string }
        source:
          type: string
          description: where the definition came from
          enum: [glossary, metadata, wiktionary, llm]
        gloss: { type: string }
        grammatical_note: { type: string }
        example: { type: string }
        etymology: { type: string }
      required: [key, source, gloss]
    Grade:
      type: object
      description: The outcome of grading one task response.
      properties:
        correct: { type: boolean }
        score: { type: number, description: "0.0..1.0" }
        feedback: { type: string }
        items_demonstrated:
          type: array
          items: { type: string }
          description: knowledge item ids the response demonstrated
        graded_by:
          type: string
          enum: [rule, llm]
      required: [correct, score, graded_by]
    Task:
      type: object
      description: One task in presentation form (answer-free content + grade once submitted).
      properties:
        task_id: { type: string }
        task_type: { type: string, description: "registered TaskType id" }
        content:
          type: object
          additionalProperties: true
          description: Present-filtered content — never includes answer keys.
        graded: { type: boolean }
        grade: { $ref: "#/components/schemas/Grade" }
      required: [task_id, task_type, content, graded]
    SessionTasks:
      type: object
      properties:
        session_id: { type: string }
        total: { type: integer }
        completed: { type: integer, description: number of tasks already graded }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
      required: [session_id, total, completed, tasks]
    SubmitTaskRequest:
      type: object
      properties:
        response:
          type: object
          additionalProperties: true
          description: type-specific response JSON (e.g. {selected_index}, {answer}, {text})
        input_method:
          type: string
          description: 'property of the response; only "typed" supported today'
          enum: [typed]
      required: [response]
    SubmitTaskResponse:
      type: object
      properties:
        task_id: { type: string }
        grade: { $ref: "#/components/schemas/Grade" }
      required: [task_id, grade]
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
