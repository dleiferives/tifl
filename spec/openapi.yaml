        kind: { type: string }
        prompt_version: { type: string }
        model: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        latency_ms: { type: integer }
        status:
          type: string
          enum: [success, error, timeout]
        error_detail: { type: string }
        called_at: { type: number, format: double }
        cost_usd: { type: number, format: double }
        cost_known: { type: boolean }
      required:
        - call_id
        - kind
        - prompt_version
        - model
        - status
        - called_at
        - cost_known
    CostSummary:
      type: object
