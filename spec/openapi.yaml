openapi: 3.1.0
info:
  title: tifl API
  version: 0.0.1
  description: >
    Canonical contract for the tifl API server. The OpenAPI spec is the only
    contract between clients (browser / Tauri / Capacitor) and the server; every
    client is generated or hand-written against it and reaches no server
    internals. Endpoints are added here as their handlers land.
    See context/backend-server.md and context/architecture-overview.md.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /ping:
    get:
      summary: Liveness ping
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
        "401":
          $ref: "#/components/responses/Unauthorized"
  /languages:
    get:
      summary: List enabled language plugins
      operationId: listLanguages
      responses:
        "200":
          description: Registered languages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /llm/models:
    get:
      summary: List available LLM models
      description: >
        Returns safe model metadata from the configured LLM gateway. Provider
        credentials stay on the gateway process and are never exposed to the
        client.
      operationId: listLLMModels
      responses:
        "200":
          description: Available gateway models
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/LLMModel"
                required: [models]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /conversations:
    get:
      summary: List resumable adaptive story conversations
      operationId: listConversations
      responses:
        "200":
          description: Most recently active conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Start an adaptive Greek story conversation
      description: >
        Generates the first short Greek passage. The conversation transcript and
        depth-first repair stack are persisted before the response is returned.
      operationId: startConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationRequest"
      responses:
        "201":
          description: Conversation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /conversations/{id}:
    get:
      summary: Get an adaptive story conversation
      operationId: getConversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversation and ordered transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{id}/respond:
    post:
      summary: Submit the learner's understanding of the current Greek passage
      description: >
        Persists the learner response, assesses comprehension, and either
        descends into a simpler repair story, retries its parent, or continues
        the main narrative.
      operationId: respondToConversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondConversationRequest"
      responses:
        "200":
          description: Updated conversation and transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /conversations/{id}/respond/audio:
    post:
      summary: Transcribe a spoken interpretation and advance the story
      description: >
        Proxies the recorded audio to the configured audio-server STT endpoint,
        stores its transcript as the learner turn, then runs the same adaptive
        assessment and depth-first transition as a typed response.
      operationId: respondToConversationAudio
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ConversationAudioResponseRequest"
      responses:
        "200":
          description: Updated conversation and transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /conversations/{id}/transcribe:
    post:
      summary: Transcribe a speech chunk without advancing the story
      description: Used by Full auto mode to collect speech and interpret pass/repeat commands.
      operationId: transcribeConversationAudio
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ConversationAudioResponseRequest"
      responses:
        "200":
          description: Transcribed speech chunk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationTranscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /conversations/{id}/turns/{turn_id}/audio:
    get:
      summary: Generate speech for an assistant Greek passage
      description: >
        Authorizes the conversation and turn, then proxies the passage to the
        configured audio-server TTS endpoint. The machine-specific audio-server
        address is never exposed to the browser.
      operationId: getConversationTurnAudio
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: turn_id
          in: path
          required: true
          schema: { type: string }
        - name: part
          in: query
          required: false
          description: Select the Greek passage or an English Full auto narration segment.
          schema:
            type: string
            enum: [passage, feedback, prompt]
      responses:
        "200":
          description: Synthesized passage audio
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/register:
    post:
      security: []
      summary: Register and immediately authenticate a user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Account created; rotated refresh credential set as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/login:
    post:
      security: []
      summary: Authenticate with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Authenticated; refresh credential set as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/refresh:
    post:
      security: []
      summary: Rotate the refresh cookie and issue a new access token
      operationId: refresh
      responses:
        "200":
          description: Refreshed
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      security: []
      summary: Revoke the current refresh cookie
      operationId: logout
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              schema: { type: string }
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/logout-all:
    post:
      summary: Revoke every refresh session for the current user
      operationId: logoutAll
      responses:
        "204":
          description: All refresh sessions revoked
          headers:
            Set-Cookie:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me:
    get:
      summary: Return the authenticated user
      operationId: me
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /profile:
    get:
      summary: Return the current user's profile and client preferences
      description: >
        Returns the typed product profile used for default session generation
        and UI bootstrapping. In local/no-auth mode this is the synthetic
        `local` user's profile. Missing fields are defaulted server-side.
      operationId: getProfile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      summary: Partially update the current user's profile
      description: >
        Updates typed profile fields and shallow-merges the `preferences` object
        into the existing arbitrary client-preferences map. A preference value of
        `null` deletes that key. Unknown top-level fields are rejected so product
        state stays explicit; client-owned arbitrary values belong under
        `preferences`.
      operationId: patchProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /skills:
    get:
      summary: Return the current user's skill tree for a language
      description: >
        Returns every skill defined for the requested language, grouped by
        category and left-joined with the current user's XP/tier progress.
        Untouched skills are included with tier 0 and 0 XP so the client can
        render the complete read-only competency map. If `language` is omitted,
        the current profile's active_language is used.
      operationId: listSkills
      parameters:
        - name: language
          in: query
          required: false
          schema:
            type: string
          description: Optional enabled language code; defaults to profile.active_language.
      responses:
        "200":
          description: Skill tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillTree"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions:
    get:
      summary: List sessions for the current user
      description: >
        Newest-first session overview page for home/resume screens. Includes
        generation status, story_id when available, selected target/new counts,
        and compact task progress counts without opening the SSE stream or
        fetching task bodies.
        By default archived sessions are excluded. Pass archived=true to list
        archived sessions for restore/delete workflows. Pass language to scope
        the page to one registered language; omit it to list all languages.
      operationId: listSessions
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: language
          in: query
          required: false
          description: registered language code to scope the page to; omitted lists all languages
          schema:
            type: string
      responses:
        "200":
          description: Session overview page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/generate:
    post:
      summary: Start generating a session (story + tasks)
      description: >
        Creates a session and kicks off the staged generation pipeline
        asynchronously, returning immediately. If language is omitted, the
        current profile's active_language is used. If level is omitted, the
        server derives it from verified skill tiers when the language provides
        deterministic level rules; otherwise the current profile level is used.
        Poll progress via /sessions/{id}/events. Returns 503 if no LLM gateway
        is configured.


        Topic-guided sessions (session_type=topic_guided) require a non-empty
        topic (400 otherwise) and run a scope_check stage first: an out-of-scope
        topic fails generation with error_code GEN_SCOPE_REJECTED and a
        human-readable error_detail rather than silently producing a
        system-driven story. System-driven sessions choose a topic automatically.
      operationId: generateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "202":
          description: Generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}:
    get:
      summary: Get session detail and persisted generation progress
      description: >
        Returns one tenant-scoped session with the metadata needed to navigate to
        reader/tasks, retry failed generation, or render a progress screen without
        subscribing to SSE. Another user's session returns 404.
      operationId: getSessionDetail
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Hard-delete a session and its owned generated content
      description: >
        Removes the caller's session plus session-owned generated content such as
        generation stages, tasks, phrase sets, story tokens and glossary entries.
        User knowledge and reader exposure history are preserved; if reader
        events reference the generated story, the story row remains as their
        historical anchor.
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/debug:
    get:
      summary: Get session debug timeline and LLM audit calls
      description: >
        Returns the same tenant-scoped session detail and generation-stage
        timeline as GET /sessions/{id}, plus llm_calls rows for that
        session/current-user pair ordered by call time. Another user's session
        returns 404. This bounded slice is authenticated-user scoped; broader
        dev/admin-only gating is a follow-up.
      operationId: getSessionDebug
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Session debug detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDebug"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/archive:
    post:
      summary: Archive a session
      description: >
        Soft-archives the caller's session so it disappears from the default
        session list while remaining restorable from archived=true.
      operationId: archiveSession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session archived
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Restore an archived session
      description: >
        Clears archived_at so the caller's session returns to the default session
        list.
      operationId: unarchiveSession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session restored
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/content:
    get:
      summary: Get a session's content (story reference or phrase set)
      description: >
        Loads whatever a session produced, discriminated by content_type. For a
        story it returns a reference the client loads through GET /stories/{id}
        (story content_type); for an expression-guided phrase session it returns
        the phrase items inline (phrase_set content_type). Phrase sets are not
        tokenized, so the reader's story endpoints do not apply to them. A story
        session whose story has not been generated yet returns 404; another user's
        session returns 404.
      operationId: getSessionContent
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Session content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/target-preview/guesses:
    post:
      summary: Record an ungraded target-preview guess
      description: >
        Stores one warm-up attempt for a selected target item in this session.
        Attempts are ungraded learning-prep data: they do not update knowledge
        state and may be replaced by re-submitting the same item. The item must
        be one of the session's selected targets.
      operationId: recordTargetPreviewGuess
      parameters:
        - $ref: "#/components/parameters/SessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetPreviewGuessRequest"
      responses:
        "200":
          description: Guess recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetPreviewAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/events:
    get:
      summary: Stream generation progress (SSE)
      description: >
        Server-Sent Events stream of stage transitions. On connect the current
        persisted stage state is replayed, then live events follow until a
        terminal `{"stage":"done"}` event. The terminal event is enriched from
        persisted session detail so late subscribers receive the same navigation
        fields as live subscribers: final status, session_id, story_id when
        ready, compact task progress, stage summary, and failed stage/error code
        when generation failed. token_rate is an approximate upstream
        tokens/second during story generation (a ticker animation); story text
        is never streamed.
      operationId: sessionEvents
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/GenerationEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/reading:
    post:
      summary: Mark a session as reading (ready→reading)
      description: >
        Transitions the session status from ready to reading and records
        reading_started_at. Idempotent: if the session is already reading or
        complete the call succeeds with 204.
      operationId: startReading
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session is now in reading state
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /sessions/{id}/complete:
    post:
      summary: Mark a session as complete (reading→complete)
      description: >
        Transitions the session status from reading to complete and records
        completed_at. Idempotent: if the session is already complete the call
        succeeds with 204.
      operationId: completeSession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session is now in complete state
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /sessions/{id}/retry:
    post:
      summary: Retry a failed generation from its failed stage
      description: >
        Resumes generation using session_generation_stages: a full re-run if the
        story never completed, or only the failed task-type stages otherwise.
      operationId: retrySession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "202":
          description: Retry started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /stories:
    get:
      summary: List the current user's legacy standalone imports
      description: >
        Newest-first page of legacy standalone imported stories — rows in the
        stories table with no study session. New user-added stories are
        session-backed and are listed via GET /sessions. The
        title is a clean display label (the "Imported: " topic prefix is
        stripped; untitled imports fall back to the first words of the text).
        By default all languages are included; pass language to scope the page
        to one language.
      operationId: listImportedStories
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: language
          in: query
          required: false
          description: registered language code to scope the page to; omitted lists all languages
          schema:
            type: string
      responses:
        "200":
          description: Imported story page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedStoryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/import:
    post:
      summary: Add user-provided text as a story
      description: >
        Persists caller-provided target-language text as a first-class,
        session-backed story the normal reader can load via GET /stories/{id}.
        The response includes both story_id and session_id. Clients may send
        pasted text as JSON or upload one UTF-8 text/plain .txt file with
        multipart/form-data. PDF/EPUB extraction is deferred. If language or
        level is omitted, the current profile defaults are used. Tasks are
        generated separately through POST /stories/{id}/tasks/generate.
      operationId: importStory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportStoryRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportStoryUploadRequest"
      responses:
        "201":
          description: Imported story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportStoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/{id}:
    get:
      summary: Load a story for the reader (tokens + knowledge in one call)
      description: >
        Returns the server-tokenized story, authoritative sentence spans, and
        the caller's canonical knowledge map plus per-surface level map for the
        story's language, in a single response. Sentence spans use half-open token
        positions: start_position is included and end_position is one past the
        final token in the sentence. Ordinary reader ratings are keyed to the
        token's exact form_key; explicit lemma/root well-known/ignored actions
        use the canonical knowledge map. Stories are user-scoped; another user's
        story returns 404.
      operationId: getStory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: paged
          in: query
          description: >
            Return one bounded, sentence-aligned reader page instead of the
            entire token stream. The page containing the saved reading position
            is used unless position is supplied.
          schema: { type: boolean, default: false }
        - name: position
          in: query
          description: Global story-token position whose page should be returned when paged=true.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Story tokens + knowledge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryLoad"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      summary: Edit a user-added story
      description: >
        Replaces and retokenizes caller-authored story text. Only a story backed
        by a user_added session can be edited. Saving clears generated tasks,
        task checkpoints, reader-position events, glossary, and story audio
        derived from the previous revision, and resets the session to ready.
        Learner knowledge is preserved. A story currently generating returns
        409.
      operationId: updateStory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoryRequest"
      responses:
        "204":
          description: Story updated and session-derived state reset
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Delete a story (imported or generated)
      description: >
        Deletes the owner's story. One endpoint, two meanings: a standalone
        imported story deletes the story row and its tokens/glossary/audio and
        the caller's reader events for it; a session-backed story (generated or
        user-added) deletes the whole session via the existing session-delete cascade
        (story, tasks, phrases, generation stages). Ownership is enforced —
        another user's story returns 404.
      operationId: deleteStory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/{id}/tasks/generate:
    post:
      summary: Generate practice tasks for a user-added story
      description: >
        Starts the existing checkpointed task-generation pipeline against the
        caller's persisted user-added story. The source text is never regenerated
        or replaced. Every completed request appends a fresh task batch while
        preserving existing tasks and answers. Repeated requests while generation
        is active are idempotent. An optional half-open token range focuses
        generation on exactly that reader selection and uses its words as the
        task targets.
      operationId: generateStoryTasks
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateStoryTasksRequest"
      responses:
        "202":
          description: Task generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/{id}/reading-progress:
    put:
      summary: Save the caller's current position in a story
      description: >
        Upserts the server-backed reader bookmark for this story. Position must
        identify a word token in the current story. Setting finished records an
        explicit finished-reading timestamp; it does not complete or archive the
        surrounding learning session. A later ordinary bookmark save preserves
        the finished timestamp.
      operationId: saveReadingProgress
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveReadingProgressRequest"
      responses:
        "200":
          description: Saved reading progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/{id}/definition:
    get:
      summary: Resolve a word definition for the reader popup
      description: >
        Walks the resolution chain for one word key: per-user dictionary →
        per-story glossary → knowledge_items.metadata → global shared cache →
        live (Wiktionary, then LLM). A live result is written to the shared cache
        so the next learner gets it free. Returns 503 if a live LLM lookup is
        needed but no gateway is configured.
      operationId: getDefinition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: key
          in: query
          required: true
          description: canonical knowledge key to define
          schema: { type: string }
      responses:
        "200":
          description: Definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Definition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/{id}/definition/options:
    get:
      summary: List the available definition sources for a reader word
      description: >
        Returns definitions already available from the learner dictionary,
        story glossary, knowledge metadata, Wiktionary imports, and model cache.
        This read-only route does not invoke a live provider.
      operationId: getDefinitionOptions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: key
          in: query
          required: true
          description: canonical knowledge key to define
          schema: { type: string }
      responses:
        "200":
          description: Available sourced definitions in display priority order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DefinitionOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /dictionary/entry:
    get:
      summary: Get one user dictionary entry
      description: >
        Returns the caller's custom dictionary entry for a canonical word key.
        Entries are user-scoped and override glossary/shared/live definitions
        only for that user.
      operationId: getDictionaryEntry
      parameters:
        - name: language
          in: query
          required: true
          schema: { type: string }
        - name: key
          in: query
          required: true
          description: canonical knowledge key
          schema: { type: string }
      responses:
        "200":
          description: User dictionary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Add or update one user dictionary entry
      description: >
        Upserts the caller's custom gloss and optional notes for a canonical word
        key. This does not create or modify shared knowledge_items rows.
      operationId: putDictionaryEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictionaryEntryRequest"
      responses:
        "200":
          description: User dictionary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Delete one user dictionary entry
      description: >
        Hard-deletes the caller's custom dictionary entry. Future definition
        lookups fall back to glossary, metadata, shared cache, and live sources.
      operationId: deleteDictionaryEntry
      parameters:
        - name: language
          in: query
          required: true
          schema: { type: string }
        - name: key
          in: query
          required: true
          description: canonical knowledge key
          schema: { type: string }
      responses:
        "204": { description: Deleted or already absent }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/{id}/sentence:
    post:
      summary: Sentence breakdown for the sentence containing a position
      description: >
        Returns the LLM-backed breakdown of the sentence containing the given
        token position. Exact normalized-sentence matches are served from the
        global breakdown cache. Fresh analyses include graph-shaped syntax data
        (token/phrase/clause/sentence nodes plus dependency-style edges) and
        materialize reusable sentence-structure and phrase/subtree cache rows;
        similar future sentences use those rows as prompt context rather than
        blindly returning another sentence's answer. The response body is the
        breakdown JSON (shape owned by the prompt builder).
      operationId: postSentenceBreakdown
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position: { type: integer }
              required: [position]
      responses:
        "200":
          description: Sentence breakdown JSON
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/{id}/sentences/{position}/audio:
    get:
      summary: Generate or retrieve speech for the current reader sentence
      description: >
        Resolves the authoritative sentence containing the supplied token
        position and synthesizes it with the learner's selected TTS model.
        The server durably stores the generated asset in its configured media
        store; private browser caching remains an additional fast path.
      operationId: getStorySentenceAudio
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: position
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
        - name: voice_model
          in: query
          required: false
          description: Client cache variant; authorization and the actual model remain server-owned.
          schema: { type: string }
      responses:
        "200":
          description: Synthesized sentence audio
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /stories/{id}/sentences/{position}/alignment:
    get:
      summary: Generate or retrieve forced word alignment for a reader sentence
      description: >
        Synthesizes the authoritative sentence with the learner's selected TTS
        model and uses the configured audio server's forced aligner to map each
        story word position to its actual start and end time.
      operationId: getStorySentenceAlignment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: position
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
        - name: voice_model
          in: query
          required: false
          description: Client cache variant; authorization and the actual model remain server-owned.
          schema: { type: string }
      responses:
        "200":
          description: Forced word timings for the sentence audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderSentenceAlignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /stories/{id}/alignments:
    post:
      summary: Align a set of prepared reader sentences as one MFA corpus
      description: >
        Loads or synthesizes the requested authoritative sentence audio, sends
        every still-unaligned clip to the audio service in one corpus job, and
        durably stores the per-sentence alignment sidecars. Existing durable
        audio and alignments are reused across browser sessions and server
        restarts.
      operationId: alignStorySentences
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderAlignmentBatchRequest"
      responses:
        "200":
          description: Requested sentence alignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderAlignmentBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /stories/{id}/word:
    post:
      summary: Deep morphological/etymological breakdown of a word
      description: >
        Returns the LLM-backed deep breakdown of a word, served from a global
        cache keyed by the canonical word key. The response body is the breakdown
        JSON (shape owned by the prompt builder).
      operationId: postWordBreakdown
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string }
              required: [key]
      responses:
        "200":
          description: Word breakdown JSON
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /reader/events:
    post:
      summary: Ingest a flushed batch of reader events
      description: >
        Appends a batch of behavioural events to the durable log (idempotent on
        event_id) and derives knowledge signals from the newly-stored ones —
        lookup_count, the per-item level (from rate events), story exposure /
        context variety (counted once per first read), and not-ready
        self-assessment on a session's selected targets. Reference peeks are
        logged for retrieval-integrity measurement but do not block the learner.
        The caller's identity is authoritative; the payload carries no user_id.
      operationId: postReaderEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderEventsRequest"
      responses:
        "202":
          description: Accepted; reports how many events were newly stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingested: { type: integer }
                required: [ingested]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /reader/surface_knowledge:
    put:
      summary: Optimistic reader rating write for one displayed word form
      description: >
        Sets the learner's visual reader level for one displayed surface form of
        a canonical word. This controls the colour of that inflected form only;
        it does not change canonical acquisition signals or the explicit
        lemma/root override stored through /word_knowledge/{token}.
      operationId: putReaderSurfaceKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderSurfaceKnowledgeRequest"
      responses:
        "204": { description: Applied }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /word_knowledge/{token}:
    put:
      summary: Explicit canonical lemma/root knowledge-rating write
      description: >
        Sets the learner's canonical level for the word whose lemma/root/stem key
        is {token}. The reader uses this only for explicit higher-effort
        lemma/root actions such as marking the underlying item well-known or
        ignored. Ordinary 1–5 ratings use /reader/surface_knowledge instead.
      operationId: putWordKnowledge
      parameters:
        - name: token
          in: path
          required: true
          description: canonical knowledge key (lemma/root/stem per language)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordKnowledgeRequest"
      responses:
        "204": { description: Applied }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/tasks:
    get:
      summary: List a session's tasks to present (answer-free)
      description: >
        Returns every task for the session in presentation form — content runs
        through the task type's Present view, so answer keys (correct_index,
        acceptable_forms) and internal item ids never reach the client — plus a
        completed/total progress count. The session is tenant-scoped; another
        user's session is a 404. A task already submitted carries its grade.
      operationId: getSessionTasks
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Session tasks + progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTasks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}:
    get:
      summary: Fetch one task to present (answer-free)
      description: >
        Returns one task in presentation form (Present-filtered content plus the
        grade once submitted), scoped to the owning user. Another user's task is a
        404.
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Presented task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}/media:
    get:
      summary: Download the authenticated task media object
      description: >
        Streams the media object referenced by the caller's task row. The client
        supplies only the task id; the server resolves the stored object key
        after tenant-scoped task lookup, so arbitrary object keys or local paths
        are never accepted from API callers.
      operationId: getTaskMedia
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task media bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}/media/url:
    get:
      summary: Create a bounded task media access URL
      description: >
        Returns a short-lived or otherwise server-scoped media access URL for
        the object referenced by the caller's task row. The response never
        includes local filesystem paths, provider object keys, or arbitrary
        caller-supplied object references.
      operationId: getTaskMediaURL
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task media access URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaURL"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}/submit:
    post:
      summary: Submit a response, grade it, update the learning signal
      description: >
        Grades the submitted response, persists it, and folds the outcome into
        user_knowledge (task_total for every targeted item, task_correct for the
        demonstrated ones), then applies skill XP changes for associated target
        skills. Rule-graded types (comprehension_mc, fill_blank) grade in-process
        with no model call; LLM-graded types (production) route through the gateway
        and return 503 when no gateway is configured. input_method is a property
        of the response — only "typed" is supported today (scan/audio later).
        Re-submission is allowed. The response includes attempt_count; the
        learning signal and skill XP use best-grade-wins semantics, so a later
        improved grade can update progress while repeat already-correct
        submissions do not double-count.
      operationId: submitTask
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTaskRequest"
      responses:
        "200":
          description: The grade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitTaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}/report:
    post:
      summary: Report a malformed task and request replacement
      description: >
        Records a generic content report snapshot for the task. For unanswered
        tasks, the server may also enqueue one-task regeneration in place,
        bounded by the per-session cap. The report is persisted even when
        regeneration is refused because the task is already answered, the cap is
        reached, or task regeneration is unavailable.
      operationId: reportTask
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskReportRequest"
      responses:
        "202":
          description: Report recorded and regeneration queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReportResponse"
        "200":
          description: Report recorded; no regeneration will run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Report recorded, but regeneration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReportResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/context:
    get:
      summary: Report whether the caller has admin access
      description: >
        Returns is_admin=true for admins. Non-admins receive 404 like every
        /admin route, so the client learns its admin state from the status code
        without the server ever advertising the admin surface. In local/no-auth
        desktop mode the single local user is always an admin (#24).
      operationId: getAdminContext
      responses:
        "200":
          description: Admin context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/sessions/{id}:
    get:
      summary: Admin lookup of any user's session debug payload
      description: >
        Returns the full session debug payload (detail, stage timeline, LLM
        calls with payloads, and derived cost) for any session regardless of
        owner. Read-only. Non-admins get 404 (#24).
      operationId: adminGetSession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Session debug detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDebug"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/users/{id}:
    get:
      summary: Admin lookup of a user's sessions and cost rollups
      description: >
        Resolves the path id as a user_id, or as an email address when it
        contains '@', then returns that user plus their sessions and cost
        rollups (per day, per model). Read-only. Non-admins get 404 (#24).
      operationId: adminGetUser
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: A user_id, or an email address (contains '@').
      responses:
        "200":
          description: User detail with cost rollups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/calls:
    get:
      summary: Global LLM call log, filtered and paginated
      description: >
        Cross-user call log for regression hunting and cost review, newest
        first. Filterable by user, model, kind, status, prompt_version, and a
        [from, to) time window; paginated by limit/offset. Rows omit the
        prompt/response payloads (fetch those via GET /admin/calls/{id}).
        Read-only. Non-admins get 404 (#24/#134/#212).
      operationId: adminListCalls
      parameters:
        - name: user_id
          in: query
          required: false
          schema: { type: string }
        - name: model
          in: query
          required: false
          schema: { type: string }
        - name: kind
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [success, error, timeout]
        - name: prompt_version
          in: query
          required: false
          schema: { type: string }
        - name: session_id
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: number, format: double }
          description: Lower bound (inclusive) on called_at, Unix seconds.
        - name: to
          in: query
          required: false
          schema: { type: number, format: double }
          description: Upper bound (exclusive) on called_at, Unix seconds.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Call-log page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCallLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/calls/{id}:
    get:
      summary: Full detail of one LLM call
      description: >
        Returns one call by id with its full prompt/response payload columns and
        derived cost — the expandable detail behind a call-log row. Read-only.
        Non-admins get 404 (#24).
      operationId: adminGetCall
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Call detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMCall"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/cost:
    get:
      summary: Global cost rollup by day × model for a window
      description: >
        Aggregates spend across all users grouped by UTC day and model over a
        [from, to) window (defaults to all time). Buckets with unpriced models
        report cost_known=false rather than a zero. Read-only. Non-admins get
        404 (#24).
      operationId: adminCostRollup
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: number, format: double }
          description: Lower bound (inclusive) on called_at, Unix seconds.
        - name: to
          in: query
          required: false
          schema: { type: number, format: double }
          description: Upper bound (exclusive) on called_at, Unix seconds.
      responses:
        "200":
          description: Cost rollup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCostRollup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionID:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    Language:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        key_strategy:
          type: string
          enum: [surface, lemma, root, stem]
        enabled: { type: boolean }
      required: [code, name, key_strategy, enabled]
    StartConversationRequest:
      type: object
      description: Greek is the fixed target language in the first release.
      properties:
        level:
          type: string
          enum: [beginner, elementary, intermediate, upper-intermediate, advanced]
          x-enum-varnames: [StartConversationLevelBeginner, StartConversationLevelElementary, StartConversationLevelIntermediate, StartConversationLevelUpperIntermediate, StartConversationLevelAdvanced]
          description: Defaults to the learner profile level.
        topic:
          type: string
          maxLength: 300
          description: Learner-chosen subject that anchors the generated story.
        source_text:
          type: string
          maxLength: 30000
          description: Existing Greek story or other text to adapt into the lesson.
    RespondConversationRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 8000
          description: The learner's best English translation and any unclear parts.
      required: [text]
    ConversationAudioResponseRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: Browser-recorded audio in a format supported by the configured audio-server.
      required: [file]
    ConversationTranscription:
      type: object
      properties:
        text: { type: string }
      required: [text]
    Conversation:
      type: object
      properties:
        conversation_id: { type: string }
        language: { type: string, const: el }
        level: { type: string }
        topic: { type: string }
        source_text: { type: string }
        status:
          type: string
          enum: [active, complete]
          x-enum-varnames: [ConversationStatusActive, ConversationStatusComplete]
        story_summary:
          type: string
          description: Compact main-narrative memory; repair stories do not replace it.
        repair_depth:
          type: integer
          minimum: 0
        turns:
          type: array
          items:
            $ref: "#/components/schemas/ConversationTurn"
        created_at: { type: number, format: double }
        updated_at: { type: number, format: double }
      required: [conversation_id, language, level, topic, source_text, status, story_summary, repair_depth, turns, created_at, updated_at]
    ConversationSummary:
      type: object
      properties:
        conversation_id: { type: string }
        language: { type: string, const: el }
        level: { type: string }
        status:
          type: string
        topic: { type: string }
        story_summary: { type: string }
        repair_depth: { type: integer, minimum: 0 }
        turn_count: { type: integer, minimum: 0 }
        created_at: { type: number, format: double }
        updated_at: { type: number, format: double }
      required: [conversation_id, language, level, status, topic, story_summary, repair_depth, turn_count, created_at, updated_at]
    ConversationList:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
      required: [conversations]
    ConversationTurn:
      type: object
      properties:
        turn_id: { type: string }
        role:
          type: string
          enum: [assistant, user]
          x-enum-varnames: [ConversationRoleAssistant, ConversationRoleUser]
        kind:
          type: string
          enum: [story, repair_story, retry, learner_response]
          x-enum-varnames: [ConversationKindStory, ConversationKindRepairStory, ConversationKindRetry, ConversationKindLearnerResponse]
        action:
          type: string
          enum: [continue_story, descend, retry_parent]
          x-enum-varnames: [ConversationActionContinueStory, ConversationActionDescend, ConversationActionRetryParent]
        assessment:
          type: string
          enum: [understood, partial, not_understood]
          x-enum-varnames: [ConversationAssessmentUnderstood, ConversationAssessmentPartial, ConversationAssessmentNotUnderstood]
        greek_text:
          type: string
          description: Target-language passage; suitable for display and future TTS.
        english_text:
          type: string
          description: Brief correction or teaching feedback.
        prompt_text:
          type: string
          description: Learner-facing request for a translation/uncertainty report.
        input_text:
          type: string
          description: Typed learner response.
        transcript:
          type: string
          description: STT output for spoken learner input.
        audio_url:
          type: string
          description: API-root-relative authenticated path that generates assistant TTS audio.
        focus:
          type: string
          description: The specific word or construction targeted by a repair story.
        reply_to_turn_id: { type: string }
        created_at: { type: number, format: double }
      required: [turn_id, role, kind, created_at]
    Credentials:
      type: object
      properties:
        email: { type: string }
        password:
          type: string
          minLength: 15
          maxLength: 128
      required: [email, password]
    User:
      type: object
      properties:
        user_id: { type: string }
        email: { type: string }
        created_at: { type: number, format: double }
        last_login: { type: number, format: double }
      required: [user_id, email, created_at]
    AuthResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 900 }
        user:
          $ref: "#/components/schemas/User"
      required: [access_token, token_type, expires_in, user]
    GenerateRequest:
      type: object
      properties:
        language:
          type: string
          description: "registered enabled language code, e.g. 'el'; defaults to profile.active_language"
        level:
          type: string
          description: "beginner|elementary|intermediate|upper-intermediate|advanced; defaults to derived verified skill level when available, otherwise profile.level"
        session_type:
          type: string
          enum: [system, topic_guided, expression_guided]
        topic: { type: string, description: "topic_guided only" }
        user_expressions:
          type: array
          items: { type: string }
          description: "expression_guided only"
        expression_output:
          type: string
          enum: [phrases, story]
          description: "expression_guided only"
    ImportStoryRequest:
      type: object
      properties:
        language:
          type: string
          description: "registered enabled language code, e.g. 'el'; defaults to profile.active_language"
        level:
          type: string
          description: "beginner|elementary|intermediate|upper-intermediate|advanced; defaults to profile.level"
        title:
          type: string
          description: "optional user-facing label stored as imported-story metadata"
        text:
          type: string
          description: "raw target-language text to tokenize for the reader"
      required: [text]
    ImportStoryUploadRequest:
      type: object
      properties:
        language:
          type: string
          description: "registered enabled language code, e.g. 'el'; defaults to profile.active_language"
        level:
          type: string
          description: "beginner|elementary|intermediate|upper-intermediate|advanced; defaults to profile.level"
        title:
          type: string
          description: "optional user-facing label stored as imported-story metadata"
        file:
          type: string
          format: binary
          description: "UTF-8 text/plain .txt file, at most 512 KiB"
      required: [file]
    ImportStoryResponse:
      type: object
      properties:
        story_id: { type: string }
        session_id: { type: string }
        language: { type: string }
        title: { type: string }
      required: [story_id, session_id, language]
    UpdateStoryRequest:
      type: object
      properties:
        text:
          type: string
          description: Complete replacement target-language text.
      required: [text]
    GenerateStoryTasksRequest:
      type: object
      description: >
        Omit both positions to use the full story. When present they form a
        half-open range over StoryLoad.tokens: start_position is included and
        end_position is excluded.
      properties:
        start_position:
          type: integer
          minimum: 0
          x-go-type-skip-optional-pointer: false
        end_position:
          type: integer
          minimum: 1
          x-go-type-skip-optional-pointer: false
    ImportedStory:
      type: object
      description: One row in the imported-story (standalone reader content) list.
      properties:
        story_id: { type: string }
        title:
          type: string
          description: >
            clean display title — the "Imported: " topic prefix is stripped and
            untitled imports fall back to the first words of the text.
        language: { type: string }
        level: { type: string }
        created_at: { type: number, format: double }
      required: [story_id, title, language, level, created_at]
    ImportedStoryList:
      type: object
      properties:
        stories:
          type: array
          items:
            $ref: "#/components/schemas/ImportedStory"
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
      required: [stories, limit, offset, has_more]
    Profile:
      type: object
      properties:
        user_id: { type: string }
        active_language:
          type: string
          description: "enabled language code used when generation omits language"
        level:
          type: string
          enum: [beginner, elementary, intermediate, upper-intermediate, advanced]
          description: "stored level fallback; session generation may derive a fresher value from verified skill tiers"
        ui_language:
          type: string
          description: "BCP-47 style UI/gloss language tag, e.g. 'en'"
        theme:
          type: string
          description: "theme id, e.g. 'default' or 'high-contrast'"
        llm_model:
          type: string
          description: "model id requested for LLM calls; blank uses the gateway default"
        tts_model:
          type: string
          description: "audio-server TTS model; blank uses the server default"
        preferences:
          type: object
          additionalProperties: true
          description: "arbitrary client-owned preferences; product-critical fields remain top-level"
      required: [user_id, active_language, level, ui_language, theme, llm_model, tts_model, preferences]
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        active_language:
          type: string
          description: "must name an enabled language"
        level:
          type: string
          enum: [beginner, elementary, intermediate, upper-intermediate, advanced]
          description: "stored level fallback; clients should not treat this as arbitrary preference state"
        ui_language:
          type: string
          description: "BCP-47 style UI/gloss language tag"
        theme:
          type: string
          description: "letters, numbers, '_' and '-' only"
        llm_model:
          type: string
          description: "OpenAI/OpenRouter-compatible model id; empty string clears to the gateway default"
        tts_model:
          type: string
          description: "audio-server TTS model id; empty string clears to the server default"
        preferences:
          type: object
          additionalProperties: true
          description: "shallow-merged; null values delete keys"
    LLMModel:
      type: object
      properties:
        id:
          type: string
          description: Provider model id.
        name:
          type: string
          description: Display name when provided by the upstream.
        description:
          type: string
          description: Upstream model description.
        context_length:
          type: integer
          description: Maximum context length when provided by the upstream.
      required: [id]
    SkillTree:
      type: object
      properties:
        language:
          type: string
          description: Language code the skill tree is scoped to.
        categories:
          type: array
          items:
            $ref: "#/components/schemas/SkillCategory"
      required: [language, categories]
    SkillCategory:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillProgress"
      required: [id, title, skills]
    SkillProgress:
      type: object
      properties:
        skill_id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        tier: { type: integer, minimum: 0 }
        tier_count: { type: integer, minimum: 1 }
        tier_label:
          type: string
          description: Display label for the current tier, e.g. Not started, Introduced, Practicing, Acquired.
        xp: { type: integer, minimum: 0 }
        xp_per_tier: { type: integer, minimum: 1 }
        xp_to_next:
          type: integer
          minimum: 0
          description: XP remaining before the next tier threshold; 0 at the max tier.
        progress_ratio:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Progress through the current tier as a 0..1 ratio.
        pending_verification:
          type: boolean
          description: True when XP has crossed a tier boundary and AI verification has not completed.
        recently_promoted:
          type: boolean
          description: True shortly after a verified tier promotion.
        last_verified_at: { type: number, format: double }
        updated_at: { type: number, format: double }
      required:
        - skill_id
        - name
        - description
        - category
        - tier
        - tier_count
        - tier_label
        - xp
        - xp_per_tier
        - xp_to_next
        - progress_ratio
        - pending_verification
        - recently_promoted
    SessionRef:
      type: object
      properties:
        session_id: { type: string }
        status: { type: string }
      required: [session_id, status]
    SelectedItemCounts:
      type: object
      description: Persisted SelectedItems counts; background items are not currently stored.
      properties:
        targets: { type: integer }
        new: { type: integer }
      required: [targets, new]
    TaskProgress:
      type: object
      properties:
        total: { type: integer }
        completed: { type: integer, description: number of tasks already graded }
        pending: { type: integer }
      required: [total, completed, pending]
    TargetPreviewGuessKind:
      type: string
      enum: [text, no_idea]
    TargetPreviewAttempt:
      type: object
      description: One ungraded warm-up attempt for a selected target item.
      properties:
        item_id: { type: string }
        guess_kind:
          $ref: "#/components/schemas/TargetPreviewGuessKind"
        guess_text: { type: string }
        correct:
          type: boolean
          description: Present only when correctness is computable without an LLM call.
        created_at: { type: number, format: double }
        updated_at: { type: number, format: double }
      required: [item_id, guess_kind, created_at]
    TargetPreviewItem:
      type: object
      description: A selected target item suitable for the generation warm-up.
      properties:
        item_id: { type: string }
        language: { type: string }
        item_type: { type: string }
        key: { type: string }
        display: { type: string }
      required: [item_id, language, item_type, key, display]
    TargetPreview:
      type: object
      description: Selected targets and any ungraded preview attempts for this session.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TargetPreviewItem"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/TargetPreviewAttempt"
      required: [items, attempts]
    TargetPreviewGuessRequest:
      type: object
      properties:
        item_id: { type: string }
        guess_kind:
          $ref: "#/components/schemas/TargetPreviewGuessKind"
        guess_text:
          type: string
          description: Required when guess_kind is text; ignored for no_idea.
      required: [item_id, guess_kind]
    SessionOverview:
      type: object
      description: One home/resume row for the current user.
      properties:
        session_id: { type: string }
        story_id: { type: string, description: "present once a story has been persisted for the session" }
        language: { type: string }
        level: { type: string }
        session_type:
          type: string
          enum: [system, topic_guided, expression_guided, user_added]
        content_type:
          type: string
          enum: [story, phrase_set]
          description: >
            what the session's content is — a narrative story or a phrase set.
            Derived from the session shape (expression-guided + expression_output
            phrases is a phrase set; everything else is a story). Tells the client
            whether to load /stories/{id} or the phrase set via /sessions/{id}/content.
        topic: { type: string }
        user_expressions:
          type: array
          items: { type: string }
        expression_output:
          type: string
          enum: [phrases, story]
        status:
          type: string
          enum: [pending, generating, ready, reading, complete, failed]
        created_at: { type: number, format: double }
        archived_at: { type: number, format: double }
        reading_started_at: { type: number, format: double }
        completed_at: { type: number, format: double }
        selected_counts:
          $ref: "#/components/schemas/SelectedItemCounts"
        tasks:
          $ref: "#/components/schemas/TaskProgress"
      required:
        - session_id
        - language
        - level
        - session_type
        - content_type
        - status
        - created_at
        - selected_counts
        - tasks
    SessionList:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionOverview"
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
      required: [sessions, limit, offset, has_more]
    StageSummary:
      type: object
      properties:
        total: { type: integer }
        pending: { type: integer }
        in_progress: { type: integer }
        complete: { type: integer }
        failed: { type: integer }
        active_stage: { type: string }
        failed_stage: { type: string }
      required: [total, pending, in_progress, complete, failed]
    GenerationStageRecord:
      type: object
      properties:
        stage: { type: string }
        status:
          type: string
          enum: [pending, in_progress, complete, failed]
        started_at: { type: number, format: double }
