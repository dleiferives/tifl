openapi: 3.1.0
info:
  title: tifl API
  version: 0.0.1
  description: >
    Canonical contract for the tifl API server. The OpenAPI spec is the only
    contract between clients (browser / Tauri / Capacitor) and the server; every
    client is generated or hand-written against it and reaches no server
    internals. Endpoints are added here as their handlers land.
    See context/backend-server.md and context/architecture-overview.md.
servers:
  - url: /api/v1
paths:
  /ping:
    get:
      summary: Liveness ping
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
  /sessions/generate:
    post:
      summary: Start generating a session (story + tasks)
      description: >
        Creates a session and kicks off the staged generation pipeline
        asynchronously, returning immediately. Poll progress via
        /sessions/{id}/events. Returns 503 if no LLM gateway is configured.
      operationId: generateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "202":
          description: Generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRef"
        "400": { description: Missing or unknown language }
        "503": { description: Generation not configured }
  /sessions/{id}/events:
    get:
      summary: Stream generation progress (SSE)
      description: >
        Server-Sent Events stream of stage transitions. On connect the current
        persisted stage state is replayed, then live events follow until a
        terminal `{"stage":"done"}` event. token_rate is an approximate upstream
        tokens/second during story generation (a ticker animation); story text is
        never streamed.
      operationId: sessionEvents
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/GenerationEvent"
        "404": { description: Session not found }
  /sessions/{id}/retry:
    post:
      summary: Retry a failed generation from its failed stage
      description: >
        Resumes generation using session_generation_stages: a full re-run if the
        story never completed, or only the failed task-type stages otherwise.
      operationId: retrySession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "202":
          description: Retry started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRef"
        "404": { description: Session not found }
        "503": { description: Generation not configured }
  /stories/{id}:
    get:
      summary: Load a story for the reader (tokens + knowledge in one call)
      description: >
        Returns the server-tokenized story plus the caller's per-item knowledge
        map (canonical key → level + lookup_count) for the story's language, in a
        single response — everything the reader needs at load time. Words the user
        has never interacted with are absent from the map and treated as unseen.
        Stories are user-scoped; another user's story returns 404.
      operationId: getStory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Story tokens + knowledge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryLoad"
        "404": { description: Story not found }
# Planned surfaces (see context/): /auth/*, /reader/events,
# /word_knowledge/{token}, /stories/{id}/sentence, /stories/{id}/word,
# /tasks/{id}, /skills.
components:
  parameters:
    SessionID:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    GenerateRequest:
      type: object
      properties:
        language: { type: string, description: "registered language code, e.g. 'el'" }
        level: { type: string, description: "beginner|elementary|intermediate|upper-intermediate|advanced" }
        session_type:
          type: string
          enum: [system, topic_guided, expression_guided]
        topic: { type: string, description: "topic_guided only" }
        user_expressions:
          type: array
          items: { type: string }
          description: "expression_guided only"
        expression_output:
          type: string
          enum: [phrases, story]
          description: "expression_guided only"
      required: [language]
    SessionRef:
      type: object
      properties:
        session_id: { type: string }
        status: { type: string }
      required: [session_id, status]
    GenerationEvent:
      type: object
      description: One SSE progress message (the JSON in each data line).
      properties:
        stage:
          type: string
          description: "selection|story_generation|tokenization|task_<type>|done"
        status:
          type: string
          enum: [pending, in_progress, complete, failed]
        token_rate: { type: integer, description: "approx upstream tokens/sec" }
        error_code: { type: string, description: "stable code, set only on failure" }
      required: [stage]
    StoryToken:
      type: object
      description: One token of the server-tokenized story; non-word tokens carry no key.
      properties:
        position: { type: integer, description: "0-indexed, stable identifier" }
        surface: { type: string, description: "display form incl. punctuation" }
        key: { type: string, description: "canonical knowledge key; omitted for non-word tokens" }
        is_word: { type: boolean }
      required: [position, surface, is_word]
    ReaderKnowledge:
      type: object
      description: The reader's per-item view, keyed by canonical key.
      properties:
        level:
          type: string
          description: "learner self-rating; '' (omitted)=unseen"
          enum: ["", "1", "2", "3", "4", "5", well_known, ignored]
        lookup_count: { type: integer }
      required: [level, lookup_count]
    StoryLoad:
      type: object
      description: Everything the reader needs at load time, in one response.
      properties:
        story_id: { type: string }
        language: { type: string }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/StoryToken" }
        knowledge:
          type: object
          description: "canonical key → knowledge state; unseen items are absent"
          additionalProperties: { $ref: "#/components/schemas/ReaderKnowledge" }
      required: [story_id, language, tokens, knowledge]
