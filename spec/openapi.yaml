openapi: 3.1.0
info:
  title: tifl API
  version: 0.0.1
  description: >
    Canonical contract for the tifl API server. The OpenAPI spec is the only
    contract between clients (browser / Tauri / Capacitor) and the server; every
    client is generated or hand-written against it and reaches no server
    internals. Endpoints are added here as their handlers land.
    See context/backend-server.md and context/architecture-overview.md.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /ping:
    get:
      summary: Liveness ping
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
        "401":
          $ref: "#/components/responses/Unauthorized"
  /languages:
    get:
      summary: List enabled language plugins
      operationId: listLanguages
      responses:
        "200":
          description: Registered languages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /llm/models:
    get:
      summary: List available LLM models
      description: >
        Returns safe model metadata from the configured LLM gateway. Provider
        credentials stay on the gateway process and are never exposed to the
        client.
      operationId: listLLMModels
      responses:
        "200":
          description: Available gateway models
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/LLMModel"
                required: [models]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/register:
    post:
      security: []
      summary: Register and immediately authenticate a user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Account created; rotated refresh credential set as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/login:
    post:
      security: []
      summary: Authenticate with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Authenticated; refresh credential set as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/refresh:
    post:
      security: []
      summary: Rotate the refresh cookie and issue a new access token
      operationId: refresh
      responses:
        "200":
          description: Refreshed
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      security: []
      summary: Revoke the current refresh cookie
      operationId: logout
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              schema: { type: string }
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/logout-all:
    post:
      summary: Revoke every refresh session for the current user
      operationId: logoutAll
      responses:
        "204":
          description: All refresh sessions revoked
          headers:
            Set-Cookie:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me:
    get:
      summary: Return the authenticated user
      operationId: me
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /profile:
    get:
      summary: Return the current user's profile and client preferences
      description: >
        Returns the typed product profile used for default session generation
        and UI bootstrapping. In local/no-auth mode this is the synthetic
        `local` user's profile. Missing fields are defaulted server-side.
      operationId: getProfile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      summary: Partially update the current user's profile
      description: >
        Updates typed profile fields and shallow-merges the `preferences` object
        into the existing arbitrary client-preferences map. A preference value of
        `null` deletes that key. Unknown top-level fields are rejected so product
        state stays explicit; client-owned arbitrary values belong under
        `preferences`.
      operationId: patchProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /skills:
    get:
      summary: Return the current user's skill tree for a language
      description: >
        Returns every skill defined for the requested language, grouped by
        category and left-joined with the current user's XP/tier progress.
        Untouched skills are included with tier 0 and 0 XP so the client can
        render the complete read-only competency map. If `language` is omitted,
        the current profile's active_language is used.
      operationId: listSkills
      parameters:
        - name: language
          in: query
          required: false
          schema:
            type: string
          description: Optional enabled language code; defaults to profile.active_language.
      responses:
        "200":
          description: Skill tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillTree"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions:
    get:
      summary: List sessions for the current user
      description: >
        Newest-first session overview page for home/resume screens. Includes
        generation status, story_id when available, selected target/new counts,
        and compact task progress counts without opening the SSE stream or
        fetching task bodies.
        By default archived sessions are excluded. Pass archived=true to list
        archived sessions for restore/delete workflows.
      operationId: listSessions
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Session overview page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/generate:
    post:
      summary: Start generating a session (story + tasks)
      description: >
        Creates a session and kicks off the staged generation pipeline
        asynchronously, returning immediately. If language is omitted, the
        current profile's active_language is used. If level is omitted, the
        server derives it from verified skill tiers when the language provides
        deterministic level rules; otherwise the current profile level is used.
        Poll progress via /sessions/{id}/events. Returns 503 if no LLM gateway
        is configured.


        Topic-guided sessions (session_type=topic_guided) require a non-empty
        topic (400 otherwise) and run a scope_check stage first: an out-of-scope
        topic fails generation with error_code GEN_SCOPE_REJECTED and a
        human-readable error_detail rather than silently producing a
        system-driven story. System-driven sessions choose a topic automatically.
      operationId: generateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "202":
          description: Generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}:
    get:
      summary: Get session detail and persisted generation progress
      description: >
        Returns one tenant-scoped session with the metadata needed to navigate to
        reader/tasks, retry failed generation, or render a progress screen without
        subscribing to SSE. Another user's session returns 404.
      operationId: getSessionDetail
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Hard-delete a session and its owned generated content
      description: >
        Removes the caller's session plus session-owned generated content such as
        generation stages, tasks, phrase sets, story tokens and glossary entries.
        User knowledge and reader exposure history are preserved; if reader
        events reference the generated story, the story row remains as their
        historical anchor.
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/debug:
    get:
      summary: Get session debug timeline and LLM audit calls
      description: >
        Returns the same tenant-scoped session detail and generation-stage
        timeline as GET /sessions/{id}, plus llm_calls rows for that
        session/current-user pair ordered by call time. Another user's session
        returns 404. This bounded slice is authenticated-user scoped; broader
        dev/admin-only gating is a follow-up.
      operationId: getSessionDebug
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Session debug detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDebug"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/archive:
    post:
      summary: Archive a session
      description: >
        Soft-archives the caller's session so it disappears from the default
        session list while remaining restorable from archived=true.
      operationId: archiveSession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session archived
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Restore an archived session
      description: >
        Clears archived_at so the caller's session returns to the default session
        list.
      operationId: unarchiveSession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session restored
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/content:
    get:
      summary: Get a session's content (story reference or phrase set)
      description: >
        Loads whatever a session produced, discriminated by content_type. For a
        story it returns a reference the client loads through GET /stories/{id}
        (story content_type); for an expression-guided phrase session it returns
        the phrase items inline (phrase_set content_type). Phrase sets are not
        tokenized, so the reader's story endpoints do not apply to them. A story
        session whose story has not been generated yet returns 404; another user's
        session returns 404.
      operationId: getSessionContent
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Session content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/events:
    get:
      summary: Stream generation progress (SSE)
      description: >
        Server-Sent Events stream of stage transitions. On connect the current
        persisted stage state is replayed, then live events follow until a
        terminal `{"stage":"done"}` event. The terminal event is enriched from
        persisted session detail so late subscribers receive the same navigation
        fields as live subscribers: final status, session_id, story_id when
        ready, compact task progress, stage summary, and failed stage/error code
        when generation failed. token_rate is an approximate upstream
        tokens/second during story generation (a ticker animation); story text
        is never streamed.
      operationId: sessionEvents
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/GenerationEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/reading:
    post:
      summary: Mark a session as reading (ready→reading)
      description: >
        Transitions the session status from ready to reading and records
        reading_started_at. Idempotent: if the session is already reading or
        complete the call succeeds with 204.
      operationId: startReading
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session is now in reading state
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /sessions/{id}/complete:
    post:
      summary: Mark a session as complete (reading→complete)
      description: >
        Transitions the session status from reading to complete and records
        completed_at. Idempotent: if the session is already complete the call
        succeeds with 204.
      operationId: completeSession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "204":
          description: Session is now in complete state
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /sessions/{id}/retry:
    post:
      summary: Retry a failed generation from its failed stage
      description: >
        Resumes generation using session_generation_stages: a full re-run if the
        story never completed, or only the failed task-type stages otherwise.
      operationId: retrySession
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "202":
          description: Retry started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /stories/{id}:
    get:
      summary: Load a story for the reader (tokens + knowledge in one call)
      description: >
        Returns the server-tokenized story, authoritative sentence spans, and
        the caller's canonical knowledge map plus per-surface level map for the
        story's language, in a single response. Sentence spans use half-open token
        positions: start_position is included and end_position is one past the
        final token in the sentence. Ordinary reader ratings are keyed to the
        token's exact form_key; explicit lemma/root well-known/ignored actions
        use the canonical knowledge map. Stories are user-scoped; another user's
        story returns 404.
      operationId: getStory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Story tokens + knowledge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryLoad"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/{id}/definition:
    get:
      summary: Resolve a word definition for the reader popup
      description: >
        Walks the resolution chain for one word key: per-user dictionary →
        per-story glossary → knowledge_items.metadata → global shared cache →
        live (Wiktionary, then LLM). A live result is written to the shared cache
        so the next learner gets it free. Returns 503 if a live LLM lookup is
        needed but no gateway is configured.
      operationId: getDefinition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: key
          in: query
          required: true
          description: canonical knowledge key to define
          schema: { type: string }
      responses:
        "200":
          description: Definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Definition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /dictionary/entry:
    get:
      summary: Get one user dictionary entry
      description: >
        Returns the caller's custom dictionary entry for a canonical word key.
        Entries are user-scoped and override glossary/shared/live definitions
        only for that user.
      operationId: getDictionaryEntry
      parameters:
        - name: language
          in: query
          required: true
          schema: { type: string }
        - name: key
          in: query
          required: true
          description: canonical knowledge key
          schema: { type: string }
      responses:
        "200":
          description: User dictionary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Add or update one user dictionary entry
      description: >
        Upserts the caller's custom gloss and optional notes for a canonical word
        key. This does not create or modify shared knowledge_items rows.
      operationId: putDictionaryEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictionaryEntryRequest"
      responses:
        "200":
          description: User dictionary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Delete one user dictionary entry
      description: >
        Hard-deletes the caller's custom dictionary entry. Future definition
        lookups fall back to glossary, metadata, shared cache, and live sources.
      operationId: deleteDictionaryEntry
      parameters:
        - name: language
          in: query
          required: true
          schema: { type: string }
        - name: key
          in: query
          required: true
          description: canonical knowledge key
          schema: { type: string }
      responses:
        "204": { description: Deleted or already absent }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/{id}/sentence:
    post:
      summary: Sentence breakdown for the sentence containing a position
      description: >
        Returns the LLM-backed breakdown of the sentence containing the given
        token position. Exact normalized-sentence matches are served from the
        global breakdown cache. Fresh analyses include graph-shaped syntax data
        (token/phrase/clause/sentence nodes plus dependency-style edges) and
        materialize reusable sentence-structure and phrase/subtree cache rows;
        similar future sentences use those rows as prompt context rather than
        blindly returning another sentence's answer. The response body is the
        breakdown JSON (shape owned by the prompt builder).
      operationId: postSentenceBreakdown
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position: { type: integer }
              required: [position]
      responses:
        "200":
          description: Sentence breakdown JSON
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /stories/{id}/word:
    post:
      summary: Deep morphological/etymological breakdown of a word
      description: >
        Returns the LLM-backed deep breakdown of a word, served from a global
        cache keyed by the canonical word key. The response body is the breakdown
        JSON (shape owned by the prompt builder).
      operationId: postWordBreakdown
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string }
              required: [key]
      responses:
        "200":
          description: Word breakdown JSON
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /reader/events:
    post:
      summary: Ingest a flushed batch of reader events
      description: >
        Appends a batch of behavioural events to the durable log (idempotent on
        event_id) and derives knowledge signals from the newly-stored ones —
        lookup_count, the per-item level (from rate events), and story exposure /
        context variety (counted once per first read). The caller's identity is
        authoritative; the payload carries no user_id.
      operationId: postReaderEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderEventsRequest"
      responses:
        "202":
          description: Accepted; reports how many events were newly stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingested: { type: integer }
                required: [ingested]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /reader/surface_knowledge:
    put:
      summary: Optimistic reader rating write for one displayed word form
      description: >
        Sets the learner's visual reader level for one displayed surface form of
        a canonical word. This controls the colour of that inflected form only;
        it does not change canonical acquisition signals or the explicit
        lemma/root override stored through /word_knowledge/{token}.
      operationId: putReaderSurfaceKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReaderSurfaceKnowledgeRequest"
      responses:
        "204": { description: Applied }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /word_knowledge/{token}:
    put:
      summary: Explicit canonical lemma/root knowledge-rating write
      description: >
        Sets the learner's canonical level for the word whose lemma/root/stem key
        is {token}. The reader uses this only for explicit higher-effort
        lemma/root actions such as marking the underlying item well-known or
        ignored. Ordinary 1–5 ratings use /reader/surface_knowledge instead.
      operationId: putWordKnowledge
      parameters:
        - name: token
          in: path
          required: true
          description: canonical knowledge key (lemma/root/stem per language)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordKnowledgeRequest"
      responses:
        "204": { description: Applied }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /sessions/{id}/tasks:
    get:
      summary: List a session's tasks to present (answer-free)
      description: >
        Returns every task for the session in presentation form — content runs
        through the task type's Present view, so answer keys (correct_index,
        acceptable_forms) and internal item ids never reach the client — plus a
        completed/total progress count. The session is tenant-scoped; another
        user's session is a 404. A task already submitted carries its grade.
      operationId: getSessionTasks
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Session tasks + progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTasks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}:
    get:
      summary: Fetch one task to present (answer-free)
      description: >
        Returns one task in presentation form (Present-filtered content plus the
        grade once submitted), scoped to the owning user. Another user's task is a
        404.
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Presented task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}/submit:
    post:
      summary: Submit a response, grade it, update the learning signal
      description: >
        Grades the submitted response, persists it, and folds the outcome into
        user_knowledge (task_total for every targeted item, task_correct for the
        demonstrated ones), then applies skill XP changes for associated target
        skills. Rule-graded types (comprehension_mc, fill_blank) grade in-process
        with no model call; LLM-graded types (production) route through the gateway
        and return 503 when no gateway is configured. input_method is a property
        of the response — only "typed" is supported today (scan/audio later).
        Re-submission is allowed. The response includes attempt_count; the
        learning signal and skill XP use best-grade-wins semantics, so a later
        improved grade can update progress while repeat already-correct
        submissions do not double-count.
      operationId: submitTask
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTaskRequest"
      responses:
        "200":
          description: The grade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitTaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionID:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    Language:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        key_strategy:
          type: string
          enum: [surface, lemma, root, stem]
        enabled: { type: boolean }
      required: [code, name, key_strategy, enabled]
    Credentials:
      type: object
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 15
          maxLength: 128
      required: [email, password]
    User:
      type: object
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        created_at: { type: number }
        last_login: { type: number }
      required: [user_id, email, created_at]
    AuthResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 900 }
        user:
          $ref: "#/components/schemas/User"
      required: [access_token, token_type, expires_in, user]
    GenerateRequest:
      type: object
      properties:
        language:
          type: string
          description: "registered enabled language code, e.g. 'el'; defaults to profile.active_language"
        level:
          type: string
          description: "beginner|elementary|intermediate|upper-intermediate|advanced; defaults to derived verified skill level when available, otherwise profile.level"
        session_type:
          type: string
          enum: [system, topic_guided, expression_guided]
        topic: { type: string, description: "topic_guided only" }
        user_expressions:
          type: array
          items: { type: string }
          description: "expression_guided only"
        expression_output:
          type: string
          enum: [phrases, story]
          description: "expression_guided only"
    Profile:
      type: object
      properties:
        user_id: { type: string }
        active_language:
          type: string
          description: "enabled language code used when generation omits language"
        level:
          type: string
          enum: [beginner, elementary, intermediate, upper-intermediate, advanced]
          description: "stored level fallback; session generation may derive a fresher value from verified skill tiers"
        ui_language:
          type: string
          description: "BCP-47 style UI/gloss language tag, e.g. 'en'"
        theme:
          type: string
          description: "theme id, e.g. 'default' or 'high-contrast'"
        llm_model:
          type: string
          description: "model id requested for LLM calls; blank uses the gateway default"
        preferences:
          type: object
          additionalProperties: true
          description: "arbitrary client-owned preferences; product-critical fields remain top-level"
      required: [user_id, active_language, level, ui_language, theme, llm_model, preferences]
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        active_language:
          type: string
          description: "must name an enabled language"
        level:
          type: string
          enum: [beginner, elementary, intermediate, upper-intermediate, advanced]
          description: "stored level fallback; clients should not treat this as arbitrary preference state"
        ui_language:
          type: string
          description: "BCP-47 style UI/gloss language tag"
        theme:
          type: string
          description: "letters, numbers, '_' and '-' only"
        llm_model:
          type: string
          description: "OpenAI/OpenRouter-compatible model id; empty string clears to the gateway default"
        preferences:
          type: object
          additionalProperties: true
          description: "shallow-merged; null values delete keys"
    LLMModel:
      type: object
      properties:
        id:
          type: string
          description: Provider model id.
        name:
          type: string
          description: Display name when provided by the upstream.
        description:
          type: string
          description: Upstream model description.
        context_length:
          type: integer
          description: Maximum context length when provided by the upstream.
      required: [id]
    SkillTree:
      type: object
      properties:
        language:
          type: string
          description: Language code the skill tree is scoped to.
        categories:
          type: array
          items:
            $ref: "#/components/schemas/SkillCategory"
      required: [language, categories]
    SkillCategory:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillProgress"
      required: [id, title, skills]
    SkillProgress:
      type: object
      properties:
        skill_id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        tier: { type: integer, minimum: 0 }
        tier_count: { type: integer, minimum: 1 }
        tier_label:
          type: string
          description: Display label for the current tier, e.g. Not started, Introduced, Practicing, Acquired.
        xp: { type: integer, minimum: 0 }
        xp_per_tier: { type: integer, minimum: 1 }
        xp_to_next:
          type: integer
          minimum: 0
          description: XP remaining before the next tier threshold; 0 at the max tier.
        progress_ratio:
          type: number
          minimum: 0
          maximum: 1
          description: Progress through the current tier as a 0..1 ratio.
        pending_verification:
          type: boolean
          description: True when XP has crossed a tier boundary and AI verification has not completed.
        recently_promoted:
          type: boolean
          description: True shortly after a verified tier promotion.
        last_verified_at: { type: number }
        updated_at: { type: number }
      required:
        - skill_id
        - name
        - description
        - category
        - tier
        - tier_count
        - tier_label
        - xp
        - xp_per_tier
        - xp_to_next
        - progress_ratio
        - pending_verification
        - recently_promoted
    SessionRef:
      type: object
      properties:
        session_id: { type: string }
        status: { type: string }
      required: [session_id, status]
    SelectedItemCounts:
      type: object
      description: Persisted SelectedItems counts; background items are not currently stored.
      properties:
        targets: { type: integer }
        new: { type: integer }
      required: [targets, new]
    TaskProgress:
      type: object
      properties:
        total: { type: integer }
        completed: { type: integer, description: number of tasks already graded }
        pending: { type: integer }
      required: [total, completed, pending]
    SessionOverview:
      type: object
      description: One home/resume row for the current user.
      properties:
        session_id: { type: string }
        story_id: { type: string, description: "present once story generation has persisted a story" }
        language: { type: string }
        level: { type: string }
        session_type:
          type: string
          enum: [system, topic_guided, expression_guided]
        content_type:
          type: string
          enum: [story, phrase_set]
          description: >
            what the session's content is — a narrative story or a phrase set.
            Derived from the session shape (expression-guided + expression_output
            phrases is a phrase set; everything else is a story). Tells the client
            whether to load /stories/{id} or the phrase set via /sessions/{id}/content.
        topic: { type: string }
        user_expressions:
          type: array
          items: { type: string }
        expression_output:
          type: string
          enum: [phrases, story]
        status:
          type: string
          enum: [pending, generating, ready, reading, complete, failed]
        created_at: { type: number }
        archived_at: { type: number }
        reading_started_at: { type: number }
        completed_at: { type: number }
        selected_counts:
          $ref: "#/components/schemas/SelectedItemCounts"
        tasks:
          $ref: "#/components/schemas/TaskProgress"
      required:
        - session_id
        - language
        - level
        - session_type
        - content_type
        - status
        - created_at
        - selected_counts
        - tasks
    SessionList:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionOverview"
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
      required: [sessions, limit, offset, has_more]
    StageSummary:
      type: object
      properties:
        total: { type: integer }
        pending: { type: integer }
        in_progress: { type: integer }
        complete: { type: integer }
        failed: { type: integer }
        active_stage: { type: string }
        failed_stage: { type: string }
      required: [total, pending, in_progress, complete, failed]
    GenerationStageRecord:
      type: object
      properties:
        stage: { type: string }
        status:
          type: string
          enum: [pending, in_progress, complete, failed]
        started_at: { type: number }
        completed_at: { type: number }
        error_code: { type: string }
        error_detail: { type: string }
        retry_count: { type: integer }
      required: [stage, status, retry_count]
    SessionDetail:
      allOf:
        - $ref: "#/components/schemas/SessionOverview"
        - type: object
          properties:
            stage_summary:
              $ref: "#/components/schemas/StageSummary"
            stages:
              type: array
              items:
                $ref: "#/components/schemas/GenerationStageRecord"
          required: [stage_summary, stages]
    LLMCall:
      type: object
      description: One llm_calls audit row scoped to a session and current user.
      properties:
        call_id: { type: string }
        session_id: { type: string }
        user_id: { type: string }
        kind: { type: string }
        prompt_version: { type: string }
        model: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        latency_ms: { type: integer }
        status:
          type: string
          enum: [success, error, timeout]
        error_detail: { type: string }
        called_at: { type: number }
      required:
        - call_id
        - kind
        - prompt_version
        - model
        - status
        - called_at
    SessionDebug:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/SessionDetail"
        llm_calls:
          type: array
          items:
            $ref: "#/components/schemas/LLMCall"
      required: [session, llm_calls]
    SessionContent:
      type: object
      description: >
        A session's content, discriminated by content_type. Exactly one of story
        or phrase_set is present.
      properties:
        session_id: { type: string }
        content_type:
          type: string
          enum: [story, phrase_set]
        story:
          $ref: "#/components/schemas/StoryContentRef"
        phrase_set:
          $ref: "#/components/schemas/PhraseSet"
      required: [session_id, content_type]
    StoryContentRef:
      type: object
      description: Reference to a story session's story; load it via GET /stories/{id}.
      properties:
        story_id: { type: string }
        language: { type: string }
      required: [story_id, language]
    PhraseSet:
      type: object
      description: The content of an expression-guided phrase session.
      properties:
        session_id: { type: string }
        language: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PhraseItem"
      required: [session_id, language, items]
    PhraseItem:
      type: object
      description: One phrase plus the annotations that explain what it teaches.
      properties:
        phrase_id: { type: string }
        target_text: { type: string, description: "the target-language phrase" }
        gloss: { type: string, description: "English translation" }
        notes: { type: string }
        target_item_ids:
          type: array
          items: { type: string }
          description: "knowledge item ids this phrase practises"
        annotations:
          type: array
          items:
            $ref: "#/components/schemas/PhraseAnnotation"
      required: [phrase_id, target_text]
    PhraseAnnotation:
      type: object
      properties:
        kind: { type: string, description: "e.g. construction | vocabulary" }
        label: { type: string }
        note: { type: string }
      required: [kind]
    GenerationEvent:
      type: object
      description: >
        One SSE progress message (the JSON in each data line). Non-terminal
        events report a pipeline stage status. The terminal `stage: done` event
        reports the final session status plus enough persisted state for the
        client to navigate to reader/tasks or show retry/error UI without
        guessing.
      properties:
        stage:
          type: string
          description: "scope_check|selection|story_generation|phrase_generation|tokenization|task_<type>|done"
        status:
          type: string
          description: "stage status for progress events; final session status for stage=done"
          enum: [pending, in_progress, complete, failed, generating, ready, reading]
        session_id:
          type: string
          description: "present on stage=done"
        content_type:
          type: string
          enum: [story, phrase_set]
          description: >
            present on stage=done; whether the session produced a story (load via
            /stories/{id}) or a phrase set (load via /sessions/{id}/content)
        story_id:
          type: string
          description: "present on stage=done once a story has been persisted"
        token_rate: { type: integer, description: "approx upstream tokens/sec" }
        error_code:
          type: string
          description: >
            stable code on failed progress events and failed terminal events;
            GEN_SCOPE_REJECTED means a topic-guided topic was out of scope for the
            learner level
        error_detail:
          type: string
          description: >
            human-readable failure reason on failed terminal events, e.g. why a
            topic was rejected and an optional simpler rephrasing to try
        failed_stage:
          type: string
          description: "first failed stage, present on failed terminal events"
        tasks:
          $ref: "#/components/schemas/TaskProgress"
        stage_summary:
          $ref: "#/components/schemas/StageSummary"
      required: [stage]
    StoryToken:
      type: object
      description: One token of the server-tokenized story; non-word tokens carry no key.
      properties:
        position: { type: integer, description: "0-indexed, stable identifier" }
        surface: { type: string, description: "display form incl. punctuation" }
        key: { type: string, description: "canonical knowledge key; omitted for non-word tokens" }
        surface_key: { type: string, description: "language-owned exact-form rating key; omitted for non-word tokens" }
        form_key: { type: string, description: "opaque key used to look up this form in surface_knowledge" }
        is_word: { type: boolean }
      required: [position, surface, is_word]
    ReaderKnowledge:
      type: object
      description: The reader's canonical per-item view, keyed by lemma/root/stem key.
      properties:
        level:
          type: string
          description: "explicit canonical learner mark; '' (omitted)=none"
          enum: ["", "1", "2", "3", "4", "5", well_known, ignored]
        lookup_count: { type: integer }
      required: [level, lookup_count]
    ReaderSurfaceKnowledge:
      type: object
      description: The reader's per-displayed-form level, keyed by StoryToken.form_key.
      properties:
        level:
          type: string
          description: "learner self-rating for this exact form; ''=unseen"
          enum: ["", "1", "2", "3", "4", "5", well_known, ignored]
      required: [level]
    SentenceSpan:
      type: object
      description: >
        Authoritative sentence boundary over story token positions. Positions
        are half-open: tokens with position >= start_position and < end_position
        are part of the sentence. Text is exactly the sentence text used by the
        sentence-breakdown cache key.
      properties:
        index:
          type: integer
          description: 0-indexed sentence number within the story.
        start_position:
          type: integer
          description: First token position in the sentence, inclusive.
        end_position:
          type: integer
          description: One past the final token position in the sentence.
        text:
          type: string
          description: Readable sentence text reconstructed from story tokens.
      required: [index, start_position, end_position, text]
    StoryLoad:
      type: object
      description: Everything the reader needs at load time, in one response.
      properties:
        story_id: { type: string }
        language: { type: string }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/StoryToken" }
        sentences:
          type: array
          description: Authoritative sentence spans for highlighting and sentence breakdown requests.
          items: { $ref: "#/components/schemas/SentenceSpan" }
        knowledge:
          type: object
          description: "canonical key → canonical knowledge state; unseen items are absent"
          additionalProperties: { $ref: "#/components/schemas/ReaderKnowledge" }
        surface_knowledge:
          type: object
          description: "StoryToken.form_key → exact-form level; unseen forms are absent"
          additionalProperties: { $ref: "#/components/schemas/ReaderSurfaceKnowledge" }
      required: [story_id, language, tokens, sentences, knowledge, surface_knowledge]
    ReaderEvent:
      type: object
      description: One logged reader interaction.
      properties:
        event_id: { type: string, description: "client idempotency key; generated if omitted" }
        story_id: { type: string }
        session_id: { type: string }
        event_type:
          type: string
          enum: [lookup, rate, navigate, sentence_break]
        position: { type: integer, description: "story token position the event is about" }
        value: { type: string, description: 'rate only: "1".."5" | "w" | "i"' }
        occurred_at: { type: number, description: "Unix seconds (client clock)" }
      required: [story_id, event_type]
    ReaderEventsRequest:
      type: object
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/ReaderEvent" }
      required: [events]
    WordKnowledgeRequest:
      type: object
      properties:
        language: { type: string }
        level:
          type: string
          description: "'' clears to unseen"
          enum: ["", "1", "2", "3", "4", "5", well_known, ignored]
      required: [language, level]
    ReaderSurfaceKnowledgeRequest:
      type: object
      properties:
        language: { type: string }
        item_key: { type: string, description: "canonical lemma/root/stem key for the token" }
        surface_key: { type: string, description: "StoryToken.surface_key for the displayed form" }
        level:
          type: string
          description: "'' clears to unseen for this exact form"
          enum: ["", "1", "2", "3", "4", "5", well_known, ignored]
      required: [language, item_key, surface_key, level]
    Definition:
      type: object
      description: A resolved word definition for the reader popup.
      properties:
        key: { type: string }
        source:
          type: string
          description: where the definition came from
          enum: [user, glossary, metadata, wiktionary, llm]
        gloss: { type: string }
        grammatical_note: { type: string }
        example: { type: string }
        etymology: { type: string }
        notes: { type: string }
      required: [key, source, gloss]
    DictionaryEntry:
      type: object
      description: A caller-owned dictionary override for one canonical word key.
      properties:
        language: { type: string }
        key: { type: string }
        gloss: { type: string }
        notes: { type: string }
      required: [language, key, gloss]
    DictionaryEntryRequest:
      type: object
      properties:
        language: { type: string }
        key:
          type: string
          description: canonical knowledge key
        gloss: { type: string }
        notes: { type: string }
      required: [language, key, gloss]
    Grade:
      type: object
      description: The outcome of grading one task response.
      properties:
        correct: { type: boolean }
        score: { type: number, description: "0.0..1.0" }
        feedback: { type: string }
        items_demonstrated:
          type: array
          items: { type: string }
          description: knowledge item ids the response demonstrated
        graded_by:
          type: string
          enum: [rule, llm]
      required: [correct, score, graded_by]
    Task:
      type: object
      description: One task in presentation form (answer-free content + grade once submitted).
      properties:
        task_id: { type: string }
        task_type: { type: string, description: "registered TaskType id" }
        content:
          type: object
          additionalProperties: true
          description: Present-filtered content — never includes answer keys.
        graded: { type: boolean }
        grade: { $ref: "#/components/schemas/Grade" }
      required: [task_id, task_type, content, graded]
    SessionTasks:
      type: object
      properties:
        session_id: { type: string }
        total: { type: integer }
        completed: { type: integer, description: number of tasks already graded }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
      required: [session_id, total, completed, tasks]
    SubmitTaskRequest:
      type: object
      properties:
        response:
          type: object
          additionalProperties: true
          description: type-specific response JSON (e.g. {selected_index}, {answer}, {text})
        input_method:
          type: string
          description: 'property of the response; only "typed" supported today'
          enum: [typed]
      required: [response]
    SubmitTaskResponse:
      type: object
      properties:
        task_id: { type: string }
        grade: { $ref: "#/components/schemas/Grade" }
        skill_xp:
          type: array
          description: Skill XP deltas persisted for this accepted grade.
          items:
            $ref: "#/components/schemas/SkillXPDelta"
        attempt_count:
          type: integer
          minimum: 1
          description: How many times this task has been submitted (1 = first submission).
      required: [task_id, grade, skill_xp, attempt_count]
    SkillXPDelta:
      type: object
      properties:
        skill_id: { type: string }
        xp_delta: { type: integer }
        xp_before: { type: integer, minimum: 0 }
        xp_after: { type: integer, minimum: 0 }
        tier_before: { type: integer, minimum: 0 }
        tier_after: { type: integer, minimum: 0 }
        pending_verify:
          type: boolean
          description: True when the skill crossed a tier threshold and awaits verification.
      required:
        - skill_id
        - xp_delta
        - xp_before
        - xp_after
        - tier_before
        - tier_after
        - pending_verify
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
