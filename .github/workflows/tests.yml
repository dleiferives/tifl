name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      # same fetch as `just freq` in storylab/justfile — the storylab tests
      # need the frequency list even in surface-token (no spaCy model) mode
      - name: Fetch Greek frequency list
        run: |
          mkdir -p storylab/vocab
          curl -sSL --max-time 120 -o storylab/vocab/el_50k.txt \
            https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/el/el_50k.txt
      - name: Unit tests
        run: make test-unit
