name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  go:
    name: Go build, vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  web:
    name: Web typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  postgres:
    name: Postgres repository tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tifl
          POSTGRES_PASSWORD: tifl
          POSTGRES_DB: tifl_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U tifl -d tifl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TIFL_TEST_DATABASE_URL: postgres://tifl:tifl@localhost:${{ job.services.postgres.ports[5432] }}/tifl_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: test postgres repository
        run: go test ./internal/db

  eval-reminder:
    name: Prompt change has eval results
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check prompt changes carry eval results
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          prompts_touched=false
          results_touched=false
          echo "$changed" | grep -qE '^internal/llm/(builders\.go|testdata/prompts/)' && prompts_touched=true
          echo "$changed" | grep -qE '^eval/(results|ITER_LOG\.md)' && results_touched=true
          if [ "$prompts_touched" = true ] && [ "$results_touched" = false ]; then
            case "$PR_BODY" in
              *eval:skip*)
                echo "prompt change with eval:skip — allowed" ;;
              *)
                echo "This PR changes prompts (builders.go or golden snapshots) without eval results."
                echo "Either commit results under eval/results/ + an ITER_LOG.md line, or add 'eval:skip' to the PR body."
                exit 1 ;;
            esac
          fi
