# tifl configuration — copy to tifl.yaml and edit.
#
#   cp tifl.config.example.yaml tifl.yaml
#   make run-gateway      # reads tifl.yaml, no env vars needed
#   make run
#
# Both binaries read this file (default: ./tifl.yaml, override with -config PATH).
# Precedence is defaults < this file < environment variables, so any value here
# can still be overridden by the matching env var (e.g. GATEWAY_MODEL) for CI or
# one-off runs. Every key is optional; omitted keys fall back to the default
# shown in the comment.

# The API server (cmd/server).
server:
  addr: 127.0.0.1:8000            # listen address                       (default 127.0.0.1:8000)
  storage_mode: sqlite            # sqlite | postgres                     (default sqlite)
  db_path: data/tifl.db           # SQLite file (sqlite mode)             (default data/tifl.db)
  database_url: ""                # Postgres DSN (postgres mode)
  llm_base_url: http://127.0.0.1:8001  # where the gateway listens        (default http://127.0.0.1:8001)
  llm_api_key: ""                 # optional gateway auth
  llm_model: ""                   # model the server requests (blank = gateway default)
  # Optional OpenAI-compatible audio-server. Blank keeps conversation TTS/STT
  # disabled; put a machine-specific URL in the git-ignored tifl.yaml.
  audio_base_url: ""              # e.g. http://127.0.0.1:8010             (default disabled)
  audio_api_key: ""               # optional audio-server bearer token
  audio_tts_model: auto            # provider id or OpenAI TTS alias        (default auto)
  audio_tts_voice: auto            # provider voice id                     (default auto)
  audio_tts_speed: 0.9             # 0.25..4 synthesis speed               (default 0.9)
  audio_stt_model: auto            # provider id or OpenAI STT alias        (default auto)
  auth_mode: none                 # none (desktop-local) | jwt (cloud)    (default none)
  jwt_secret: ""                  # signing key when auth_mode: jwt
  allow_insecure_auth_cookie: false # DEVELOPMENT ONLY: permit refresh cookie over HTTP
  frontend_dir: web/dist          # compiled SolidJS assets               (default web/dist)
  # Per-user LLM token budget: total input+output tokens a user may spend in
  # the rolling window before calls return 429. 0 (default) disables — right
  # for desktop where the user pays for their own key. (#208)
  # llm_budget_tokens: 500000
  # llm_budget_window_hours: 24
  # Knowledge predictor: "legacy" (hand-tuned formula, default) or "fsrs"
  # (FSRS-6 memory model — better scheduling; state accrues under both). (#209)
  # predictor_mode: fsrs
  # Maximum unanswered-task regenerations per session after user reports.
  # task_report_regeneration_cap: 3
  # Binary media/object storage for audio, scan/OCR, and uploads. Local mode
  # stores objects below media_local_root using stable object keys. S3 mode uses
  # an S3-compatible bucket such as AWS S3, Cloudflare R2, or MinIO.
  media_storage_mode: local        # local | s3                           (default local)
  media_local_root: data/media     # local media root                     (default data/media)
  media_public_base_url: ""        # URL prefix when serving local media or public S3/CDN objects
  media_s3_bucket: ""              # S3-compatible bucket
  media_s3_endpoint: ""            # optional S3-compatible endpoint, e.g. R2/MinIO
  media_s3_region: ""              # S3 region; R2 commonly uses "auto"
  media_s3_access_key_env: AWS_ACCESS_KEY_ID      # env var name for S3 access key
  media_s3_secret_key_env: AWS_SECRET_ACCESS_KEY  # env var name for S3 secret
  media_s3_signed_urls: true       # presign media URLs by default

  # Model pricing for cost tracking (#24). USD per 1,000,000 tokens, per model.
  # Cost is derived at query time from recorded tokens — never stored — so a
  # price change here reprices history on next view. The reserved "default"
  # entry prices any model not listed; omit it to report unlisted models as
  # "unknown" (never zero). Omitting model_pricing entirely reports every call
  # as unknown cost, which is fine — the debug/admin views still render.
  # model_pricing:
  #   default:
  #     input_per_million: 0.5
  #     output_per_million: 1.5
  #   openrouter/free:
  #     input_per_million: 0
  #     output_per_million: 0
  #   claude-3-5-haiku-latest:
  #     input_per_million: 0.8
  #     output_per_million: 4
  # Admin surface (#24): emails granted the read-only /admin/* endpoints and the
  # in-app admin UI. A user is an admin iff their email is listed here. In
  # local/no-auth desktop mode the single local user is always an admin, so this
  # only applies under auth_mode: jwt. Also settable via ADMIN_EMAILS (CSV).
  # admin_emails:
  #   - admin@example.com

# The LLM gateway (cmd/gateway). The example targets a local OpenCode server —
# a credential-free way to run a real model. Start it with:
#   opencode serve --port 4202 --hostname 127.0.0.1
gateway:
  addr: 127.0.0.1:8001            # listen address                       (default 127.0.0.1:8001)
  provider: opencode              # openrouter | ollama | openai | anthropic | opencode  (default ollama)
  upstream_url: http://127.0.0.1:4202  # provider base URL (required for opencode)
  api_key: ""                     # upstream credential (not needed for opencode/ollama)
  # api_keys: []                  # multiple credentials for the same provider; each becomes a balanced endpoint
  model: opencode/nemotron-3-ultra-free  # default model ("providerID/modelID" for opencode)
  agent: writer                   # opencode only: agent to drive        (default writer)
  # balance: least_in_flight      # least_in_flight | round_robin        (default least_in_flight)
  # max_retries: 3                # transient upstream retries           (default 3)
  # base_delay_ms: 250            # first retry backoff                  (default 250)

# OpenRouter example:
# gateway:
#   provider: openrouter
#   upstream_url: ""              # blank = https://openrouter.ai/api/v1
#   api_key: ""                   # put the real key in local tifl.yaml or GATEWAY_API_KEY, never in git
#   model: openrouter/free        # OpenRouter default when omitted; any slug from https://openrouter.ai/models works
#
# Multi-gateway / multi-key example:
# gateway:
#   balance: least_in_flight
#   gateways:
#     - name: openrouter-main
#       provider: openrouter
#       api_keys:
#         - ""                    # put real keys in local tifl.yaml, never in git
#         - ""
#       model: openrouter/free
#       models:
#         - openrouter/free
#     - name: anthropic-direct
#       provider: anthropic
#       api_keys:
#         - ""
#       model: claude-3-5-haiku-latest
#       models:
#         - claude-3-5-haiku-latest
